<script id="app-data" type="application/json">__DATA_V2__</script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById("app-data").textContent);
  const Engine = window.Engine.init(DATA);

  // Slot "P" = primary-capable weapons, "S" = sidearms (pistols) - Primary/Secondary and
  // Sidearm are mutually exclusive pools, never cross-equippable.
  const WEAPON_SLOTS = [
    { key: "Primary", label: "Primary", slot: "P", icon: "main-weapon.png" },
    { key: "Secondary", label: "Secondary", slot: "P", icon: "main-weapon.png" },
    { key: "SideArm", label: "Sidearm", slot: "S", icon: "sidearm.png" },
  ];
  const GEAR_SLOTS = [
    { key: "Mask", icon: "mask.png" }, { key: "Backpack", icon: "backpack.png" },
    { key: "Chest", icon: "chest.png" }, { key: "Gloves", icon: "gloves.png" },
    { key: "Holster", icon: "holster.png" }, { key: "Kneepads", icon: "kneepads.png" },
  ];
  const WEAPON_TYPES = ["Assault Rifle", "LMG", "Marksman Rifle", "Pistol", "Rifle", "Shotgun", "SMG"];

  // Per-slot armor catalogs (Library, and the equip picker) show only Named, Exotic, and
  // Crafted/Improvised pieces — every other High-End / Gearset piece is browsed by brand instead.
  function isArmorCatalogItem(g) { return g.Quality === "Exotic" || g.Quality === "Named" || g.Brand === "Crafted"; }
  function uniqueBrands(matchFn) {
    const set = new Set();
    GEAR_SLOTS.forEach((s) => DATA.gear[s.key].forEach((g) => { if (matchFn(g)) set.add(g.Brand); }));
    return Array.from(set).sort();
  }
  const REGULAR_BRANDS = uniqueBrands((g) => (g.Quality === "High End" || g.Quality === "Named") && g.Brand !== "Crafted");
  const GEARSET_BRANDS = uniqueBrands((g) => g.Quality === "Gearset");
  const TALENT_CATS = [
    ...WEAPON_TYPES.map((t) => ({ kind: "weapon", key: t, label: t })),
    ...GEAR_SLOTS.map((s) => ({ kind: "gear", key: s.key, label: s.key })),
  ];
  function talentsForCat(cat) {
    return cat.kind === "weapon" ? DATA.weaponTalents.filter((t) => t[cat.key] === "x") : DATA.gearTalents.filter((t) => t.Slot === cat.key);
  }
  function brandIcon(brand) {
    for (const s of GEAR_SLOTS) {
      const found = DATA.gear[s.key].find((g) => g.Brand === brand && g.Quality === "High End" && g.Icon) || DATA.gear[s.key].find((g) => g.Brand === brand && g.Icon);
      if (found) return found.Icon;
    }
    return null;
  }

  function loadSHD() {
    const levels = Engine.defaultSHDLevels();
    try {
      const saved = JSON.parse(localStorage.getItem("shd-watch-levels") || "null");
      if (Array.isArray(saved)) levels.forEach((l, i) => { if (typeof saved[i] === "number") l.value = Math.max(0, Math.min(l.max, saved[i])); });
    } catch (e) { /* ignore corrupt storage */ }
    return levels;
  }
  function saveSHD() {
    try { localStorage.setItem("shd-watch-levels", JSON.stringify(state.shd.map((l) => l.value))); } catch (e) { /* storage may be unavailable */ }
  }

  // one shared expertise level (0-30) stands in for every weapon's individual expertise, and
  // is the default for every gear piece's own expertise (gear pieces can override it below).
  function loadExpertise() {
    try {
      const raw = localStorage.getItem("expertise-level");
      if (raw !== null) {
        const saved = Number(raw);
        if (Number.isFinite(saved)) return Math.max(0, Math.min(30, saved));
      }
    } catch (e) { /* ignore corrupt storage */ }
    return 30;
  }
  function saveExpertise() {
    try { localStorage.setItem("expertise-level", String(state.expertise)); } catch (e) { /* storage may be unavailable */ }
  }
  // per-piece expertise overrides (slot -> level). A slot with no entry here just uses the
  // shared expertise level above. Stepping the shared level (up/down arrows or typing into
  // that box) wipes every override - see setExpertise().
  function loadGearExpertise() {
    try {
      const raw = localStorage.getItem("gear-expertise-overrides");
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === "object") return parsed;
      }
    } catch (e) { /* ignore corrupt storage */ }
    return {};
  }
  function saveGearExpertise() {
    try { localStorage.setItem("gear-expertise-overrides", JSON.stringify(state.gearExpertise)); } catch (e) { /* storage may be unavailable */ }
  }

  const state = { weapons: {}, gear: {}, skills: {}, spec: null, shd: loadSHD(), expertise: loadExpertise(), gearExpertise: loadGearExpertise() };
  let summaryOpen = false;
  let attachExpanded = {}; // weapon slot key -> bool, session-only UI state

  function img(kind, file, cls) { const src = Engine.iconSrc(kind, file); return src ? '<img class="' + (cls || "") + '" src="' + src + '" alt="">' : ""; }
  function qClass(quality) { return quality ? quality.replace(/\s+/g, "") : ""; }
  function stripHtml(html) { return html.replace(/<[^>]*>/g, " "); }
  function fmt(n) { return Math.round(n).toLocaleString(); }

  // Exotic > Gear Set > Named > everything else (High-End), then alphabetical within each tier
  // handles both full names (Exotic/Gearset/Named/High End) and the single-letter
  // codes used in the talent tables (E/S/N/A).
  const QUALITY_ORDER = { Exotic: 0, E: 0, Gearset: 1, S: 1, Named: 2, N: 2 };
  function qualityRank(q) { return QUALITY_ORDER[qClass(q)] !== undefined ? QUALITY_ORDER[qClass(q)] : 3; }
  function sortByQuality(list, getQuality, getName) {
    return list.slice().sort((a, b) => {
      const r = qualityRank(getQuality(a)) - qualityRank(getQuality(b));
      if (r !== 0) return r;
      return getName ? String(getName(a)).localeCompare(String(getName(b))) : 0;
    });
  }
  // colors the words that matter for scanning builds at a glance: quality tiers, the
  // "Amplify" keyword (multiplicative, not additive, damage), the stat category a bonus
  // belongs to (red=damage, yellow=utility/skill, blue=defense), status effects/conditions
  // a talent triggers on or inflicts, and distances (the game's own orange).
  //
  // To add a keyword: find the group below by color/meaning and add every inflected form
  // you expect in talent text - list each one explicitly, don't auto-generate suffixes
  // (irregular forms like "Bleeded" are wrong, so this stays a human judgment call). This
  // covers phrases with surrounding punctuation too ("(from all sources)" still matches on
  // just "from all sources" via \b, since \b only cares about the word's own edges, not
  // what's beyond them). Only a match on a dynamic value (a number) needs PHRASE_PATTERNS.
  const KEYWORD_GROUPS = [
    { cls: "kw-damage", words: ["Weapon Damage", "Assault Rifle Damage", "LMG Damage", "Marksman Rifle Damage", "Pistol Damage", "Rifle Damage", "Shotgun Damage", "SMG Damage",
      "Critical Hit Chance", "Critical Hit Damage", "Critical Hits", "Critical Hit", "Headshot Damage", "Headshots", "Headshot", "Damage to Armor", "Damage to TOC", "Damage to Health", "Health Damage", "Damage to Electronics", "Explosive Damage", "Melee"] },
    { cls: "kw-utility", words: ["Reload Speed", "Stability", "Accuracy", "Magazine Size", "Weapon Handling", "Rate of Fire",
      "Optimal Range", "Swap Speed", "Ammo Capacity", "Extra Rounds", "Skill Haste", "Skill Damage", "Skill Duration", "Repair Skills", "Skill Tier", "Skill Efficiency", "Skill Health", "Status Effects", "Status Effect"] },
    { cls: "kw-defense", words: ["Total Armor", "Bonus Armor", "Armor Regeneration", "Armor Regen", "Health", "Hazard Protection", "Explosive Resistance", "Damage Resistance",
      "Incoming Repairs", "Protection from Elites", "Armor on Kill", "Repairs", "Repaired", "Repair", "RPM"] },
    // status effects proper - the debuffs with a dedicated Resistance stat, plus every inflected
    // form (-ed/-ing/-s) actually likely to appear in talent prose, not just the base word
    { cls: "kw-condition", words: ["Bleed Resistance", "Burn Resistance", "Shock Resistance", "Disrupt Resistance", "Disorient Resistance", "Ensnare Resistance", "Pulse Resistance", "Blind/Deaf Resistance",
      "Bleed", "Bleeding", "Bleeds", "Bled",
      "Burn", "Burned", "Burning", "Burns",
      "Shock", "Shocked", "Shocking", "Shocks",
      "Disrupt", "Disrupted", "Disrupting", "Disrupts",
      "Disorient", "Disoriented", "Disorienting", "Disorients",
      "Ensnare", "Ensnared", "Ensnaring", "Ensnares",
      "Blind", "Blinded", "Blinding", "Blinds",
      "Deaf", "Deafened",
      "Confuse", "Confused", "Confusing", "Confuses",
      "EMP", "EMPed"] },
    // common battlefield states that aren't resistance-gated status effects (Suppressed isn't
    // resisted like Bleed/Burn are; Pulse here means "revealed by a Pulse", not Pulse Resistance)
    { cls: "kw-common-condition", words: ["Suppressed", "Suppression", "Suppressing", "Suppresses",
      "Pulsed", "Pulsing", "Pulses", "Pulse",
      "Poisoned", "Poisoning", "Poisons", "Poison",
      "Swapping", "Swap", "Switching", "Holstered", "Cover",
      "Marked", "Marking", "Marks", "Mark",
      "Reloading", "Reloaded", "Reload"] },
    // skill names - "Ballistic Shield" is often just called "Shield" in talent text
    { cls: "kw-skill", words: ["Sticky Bomb", "Ballistic Shield", "Shield", "Chem Launcher", "Seeker Mine", "Smart Cover", "Trap", "Decoy", "Turret", "Hive", "Firefly", "Drone"] },
    { cls: "kw-explosive", words: ["Grenade", "Grenades", "Explosion", "Explosions", "Explosive", "Explosives", "Explode", "Exploded", "Exploding", "Explodes"] },
    { cls: "kw-stack", words: ["Stacks", "Stacking", "Stacked", "Stack"] },
    // reuses kw-distance's orange - these aren't distances, the user just wants the same color
    { cls: "kw-distance", words: ["Skills", "Skill", "Allies", "Ally", "Weakpoints", "Weakpoint", "Signature Weapon"] },
    { cls: "kw-amplify", words: ["Amplifies", "Amplifying", "Amplify", "Amplified", "Amplification", "from all sources"] },
    { cls: "kw-overcharge", words: ["Overcharged", "Overcharging", "Overcharges", "Overcharge"] },
    { cls: "kw-exotic", words: ["Exotic"] },
    { cls: "kw-named", words: ["Named"] },
    { cls: "kw-highend", words: ["High End"] },
  ];
  // one combined map + single regex pass (longest phrase first) rather than one pass per
  // category - running separate passes let a short word like "Health" re-match text a longer
  // phrase ("Skill Health") had already wrapped in the previous pass, nesting spans.
  const KW_MAP = new Map();
  KEYWORD_GROUPS.forEach(({ cls, words }) => words.forEach((w) => KW_MAP.set(w.toLowerCase(), cls)));
  const KW_PATTERN = new RegExp(
    "\\b(" + [...KW_MAP.keys()].sort((a, b) => b.length - a.length).map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")\\b",
    "gi"
  );
  // entries that can't go through KW_PATTERN because the match is a dynamic value rather
  // than a fixed word (distances)
  const PHRASE_PATTERNS = [
    // "7m" / "7 meters" but not "9mm" (ammo caliber)
    { cls: "kw-distance", re: /\b\d+(?:\.\d+)?m\b(?!m)/g },
    { cls: "kw-distance", re: /\b\d+(?:\.\d+)?\s+meters?\b/gi },
  ];
  function highlightKeywords(text) {
    let out = text;
    PHRASE_PATTERNS.forEach(({ cls, re }) => { out = out.replace(re, (m) => '<span class="' + cls + '">' + m + '</span>'); });
    return out.replace(KW_PATTERN, (m) => '<span class="' + KW_MAP.get(m.toLowerCase()) + '">' + m + '</span>');
  }
  function compactDesc(text) { return text ? highlightKeywords(text.replace(/(\r?\n){2,}/g, "\n").trim()) : text; }
  function talentBlock(name, desc) {
    return '<div class="tile-talent"><div class="tt-name">' + name + '</div><div class="tt-desc">' + compactDesc(desc) + '</div></div>';
  }

  // ---- exotic exclusivity: only one exotic weapon, one exotic gear piece, at a time ----
  function hasExoticWeaponElsewhere(excludeSlot) {
    return Object.entries(state.weapons).some(([slot, w]) => slot !== excludeSlot && w && w.quality === "Exotic");
  }
  function hasExoticGearElsewhere(excludeSlot) {
    return Object.entries(state.gear).some(([slot, g]) => slot !== excludeSlot && g && g.quality === "Exotic");
  }

  function computeCurrent(shdOverride) {
    return Engine.computeLoadout({ weapons: state.weapons, gear: state.gear, specialization: state.spec ? { name: state.spec } : null, skills: state.skills, shd: shdOverride !== undefined ? shdOverride : state.shd, expertiseLevel: state.expertise, gearExpertise: state.gearExpertise });
  }

  // =================== INVENTORY: compact expandable stat summary ===================
  function renderStatSummary() {
    const result = computeCurrent();
    const p = result.weaponStats.Primary;
    // Critical Hit Chance can't exceed 60% in game - flag it the moment a build reaches or
    // passes that cap, both inline in the detail and as a small always-visible dot on the chip.
    const CHC_CAP = 60;
    const chcCapped = !!(p && p.chc >= CHC_CAP);
    const chips = [
      {
        key: "damage", label: "Weapon Damage", value: p ? fmt(p.totalDamage) : "—", sub: p ? "+" + Math.round(p.totalPct) + "%" : "",
        detail: p ? [
          ["Base Damage", fmt(p.baseDamage)],
          ["Expertise Bonus", "+" + result.totals.expertiseLevel + "%"],
          ["Total Damage", fmt(p.totalDamage)],
          ["Headshot Damage", Math.round(p.hsd) + "%"],
          ["Critical Hit Damage", Math.round(p.chd) + "%"],
          ["Critical Hit Chance", Math.round(p.chc) + "%" + (chcCapped ? ' <span class="cap-badge" title="Critical Hit Chance caps at 60% in game">' + CHC_CAP + '% CAP</span>' : "")],
          ["RPM / Magazine", p.rpm + " / " + p.magSize],
        ] : [["No primary weapon equipped", "—"]],
      },
      {
        key: "armor", label: "Total Armor", value: fmt(result.totals.armor), sub: "",
        detail: [
          ["Base Armor (lvl 40)", fmt(result.totals.baseArmorLvl40)],
          ["Expertise Bonus to Base", "+" + fmt(result.totals.expertiseBaseArmor - result.totals.baseArmorLvl40)],
          ["From Armor Cores", "+" + fmt(result.stats.Cores.Defensive.reduce((a, b) => a + b, 0))],
          ["Total Armor % Bonus", "+" + Math.round((result.stats.Defensive["Total Armor"] || 0) * 10) / 10 + "%"],
          ["Total Armor", fmt(result.totals.armor)],
          ["Health", fmt(result.totals.health)],
          ["Armor Cores Equipped", result.stats.Cores.Defensive.length],
        ],
      },
      {
        key: "skill", label: "Skill Power", value: result.totals.skillTier, sub: "Tier", detail:
          Object.keys(result.stats.Utility).length ? Object.entries(result.stats.Utility).map(([k, v]) => [k, (v > 0 && k !== "Skill Tier" ? "+" : "") + Math.round(v * 10) / 10 + (k === "Skill Tier" ? "" : "%")]) : [["No utility stats yet", "—"]],
      },
    ];
    document.getElementById("statSummaryWrap").className = "stat-summary-wrap" + (summaryOpen ? " open" : "");
    document.getElementById("statChips").innerHTML = chips.map((c) =>
      '<div class="stat-chip" data-chip="' + c.key + '">' +
      '<div class="sc-top"><span class="sc-label">' + c.label + (c.key === "damage" && chcCapped ? '<span class="sc-cap-dot" title="Critical Hit Chance capped at 60%"></span>' : "") + '</span><span class="sc-caret">▾</span></div>' +
      '<div class="sc-value">' + c.value + (c.sub ? '<span class="sc-sub">' + c.sub + '</span>' : "") + '</div></div>'
    ).join("");
    document.getElementById("statDetails").innerHTML = chips.map((c) =>
      '<div class="stat-detail-col">' + c.detail.map((d) => '<div class="stat-detail-row"><span class="label">' + d[0] + '</span><span class="value">' + d[1] + '</span></div>').join("") + '</div>'
    ).join("");
    document.querySelectorAll("[data-chip]").forEach((el) => el.addEventListener("click", () => {
      summaryOpen = !summaryOpen;
      renderStatSummary();
    }));
  }

  // =================== INVENTORY: slim exotic/named/gearset summary ===================
  function renderQualityStrip() {
    const exotics = [];
    const named = [];
    const gearsetCounts = {};
    WEAPON_SLOTS.forEach((s) => {
      const w = state.weapons[s.key];
      if (!w) return;
      if (w.quality === "Exotic") exotics.push(w.name);
      else if (w.quality === "Named") named.push(w.name);
      else if (w.quality === "Gearset") gearsetCounts[w.brand] = (gearsetCounts[w.brand] || 0) + 1;
    });
    GEAR_SLOTS.forEach((s) => {
      const g = state.gear[s.key];
      if (!g) return;
      if (g.quality === "Exotic") exotics.push(g.name);
      else if (g.quality === "Named") named.push(g.name);
      else if (g.quality === "Gearset") gearsetCounts[g.brand] = (gearsetCounts[g.brand] || 0) + 1;
    });
    const gearsets = Object.entries(gearsetCounts).map(([brand, n]) => brand + " ×" + n);

    const groups = [];
    if (exotics.length) groups.push('<span class="qs-group qs-exotic"><span class="qs-label">Exotic</span>' + exotics.map((n) => '<span class="qs-item">' + n + '</span>').join("") + '</span>');
    if (gearsets.length) groups.push('<span class="qs-group qs-gearset"><span class="qs-label">Gearset</span>' + gearsets.map((n) => '<span class="qs-item">' + n + '</span>').join("") + '</span>');
    if (named.length) groups.push('<span class="qs-group qs-named"><span class="qs-label">Named</span>' + named.map((n) => '<span class="qs-item">' + n + '</span>').join("") + '</span>');

    document.getElementById("qualityStrip").innerHTML = groups.length ? groups.join("") : '<span class="qs-empty">No exotics, named items, or gearsets equipped.</span>';
  }

  // =================== INVENTORY: gear core/attribute tally (Nx Weapon Damage, Nx Crit Chance, ...) ===================
  const STAT_TYPE_COLOR = { O: "var(--red)", D: "var(--blue)", U: "var(--yellow)" };
  const STAT_TYPE_RANK = { O: 0, D: 1, U: 2 };
  const WEAPON_TYPE_DAMAGE_STATS = ["Assault Rifle Damage", "LMG Damage", "Marksman Rifle Damage", "Pistol Damage", "Rifle Damage", "Shotgun Damage", "SMG Damage"];
  // most stats are percentages, but a handful are flat point values (distinct from their %
  // counterparts where one exists, e.g. "Armor Regeneration" vs "Armor Regeneration %")
  const FLAT_STATS = new Set(["Health", "Armor Regeneration", "Armor on Kill", "Skill Tier"]);
  function fmtPct(v) { return (v >= 0 ? "+" : "") + Math.round(v) + "%"; }
  function fmtStat(name, v) { return (v > 0 ? "+" : "") + Math.round(v * 10) / 10 + (FLAT_STATS.has(name) ? "" : "%"); }
  // Primary = the three core stats (Weapon Damage / Skill Tier / Total Armor), each shown as
  // its FULL computed total - gear cores, the equipped weapon's own attributes, brand/gearset
  // bonuses (including weapon-type-specific ones like "+10% LMG Damage"), specialization, SHD.
  // Secondary = Critical Hit Chance/Damage (same "from everything" total) plus every other
  // stat the build has a bonus in, sorted red (Offensive) -> blue (Defensive) -> yellow (Utility).
  function renderAttributeStrip() {
    const result = computeCurrent();
    const p = result.weaponStats.Primary;
    // SHD Watch grants a lot of these same stats - only show one here if something OTHER than
    // SHD (gear, weapon, brand, specialization) also provides it, by comparing against the
    // same build with SHD stripped out. The displayed amount still includes SHD's contribution.
    const resultNoShd = computeCurrent([]);
    const pNoShd = resultNoShd.weaponStats.Primary;

    const primary = [];
    if (p) { if (pNoShd && pNoShd.totalPct) primary.push(["Weapon Damage", fmtPct(p.totalPct), "O"]); }
    else {
      const awd = result.stats.Cores.Offensive.reduce((a, b) => a + b, 0);
      const awdNoShd = resultNoShd.stats.Cores.Offensive.reduce((a, b) => a + b, 0);
      if (awd && awdNoShd) primary.push(["Weapon Damage", fmtPct(awd), "O"]);
    }
    if (result.totals.skillTier && resultNoShd.totals.skillTier) primary.push(["Skill Tier", String(result.totals.skillTier), "U"]);
    const totalArmorPct = result.stats.Defensive["Total Armor"] || 0;
    if (totalArmorPct && (resultNoShd.stats.Defensive["Total Armor"] || 0)) primary.push(["Total Armor", fmtPct(totalArmorPct), "D"]);

    const secondary = [];
    const exclude = new Set(["Weapon Damage", "Total Armor", "Skill Tier", ...WEAPON_TYPE_DAMAGE_STATS]);
    if (p) {
      if (pNoShd && pNoShd.chc) secondary.push(["Critical Hit Chance", fmtPct(p.chc), "O"]);
      if (pNoShd && pNoShd.chd) secondary.push(["Critical Hit Damage", fmtPct(p.chd), "O"]);
      exclude.add("Critical Hit Chance");
      exclude.add("Critical Hit Damage");
    }
    [["Offensive", "O"], ["Defensive", "D"], ["Utility", "U"]].forEach(([cat, code]) => {
      Object.entries(result.stats[cat]).forEach(([k, v]) => {
        if (exclude.has(k) || !v) return;
        if (!(resultNoShd.stats[cat][k] || 0)) return;
        secondary.push([k, fmtStat(k, v), code]);
      });
    });
    secondary.sort((a, b) => STAT_TYPE_RANK[a[2]] - STAT_TYPE_RANK[b[2]] || a[0].localeCompare(b[0]));

    const rowHtml = ([name, amount, code]) => '<span class="qs-item" style="color:' + STAT_TYPE_COLOR[code] + '">' + amount + ' ' + name + '</span>';
    const items = [...primary.map(rowHtml), ...secondary.map(rowHtml)];
    document.getElementById("attributeStrip").innerHTML = items.length
      ? '<span class="qs-group qs-attr"><span class="qs-label">Gear Attributes</span>' + items.join("") + '</span>'
      : '<span class="qs-empty">No bonuses yet.</span>';
  }

  // =================== INVENTORY: in-depth details ===================
  function renderDepthTables() {
    const result = computeCurrent();
    const cols = [];
    function weaponCol(s) {
      const w = result.weaponStats[s.key];
      const item = state.weapons[s.key];
      const rows = w ? [
        ["Base Damage", fmt(w.baseDamage)], ["Total Damage", fmt(w.totalDamage)], ["Damage to Armored", fmt(w.dmgToArmored)],
        ["Damage Out of Cover", fmt(w.dmgToOutOfCover)], ["Headshot Damage", Math.round(w.hsd) + "%"], ["Critical Hit Damage", Math.round(w.chd) + "%"],
        ["Critical Hit Chance", Math.round(w.chc) + "%"], ["RPM", w.rpm],
        ["Magazine Size", w.totalMagSize !== w.magSize ? w.totalMagSize + " (base " + w.magSize + ")" : w.magSize],
        ["Reload Speed", (w.reloadSpeedMs / 1000).toFixed(2) + "s" + (w.reloadSpeedPct ? " (" + (w.reloadSpeedPct > 0 ? "+" : "") + Math.round(w.reloadSpeedPct) + "%)" : "")],
      ].concat(w.weapon.core2 && w.weapon.core2.stat ? [["Core 2 (" + w.weapon.core2.stat + ")", "+" + w.weapon.core2.max]] : []) : [["No weapon equipped", "—"]];
      return { title: s.label + (item ? " — " + item.name : ""), rows };
    }
    // Primary + the three stat columns lead (first row at typical widths); Secondary and
    // Sidearm — checked far less often — trail at the end.
    cols.push(weaponCol(WEAPON_SLOTS[0]));
    // in the Offensive column specifically, split damage-dealing stats (red) from
    // handling/utility-ish ones that just happen to be typed "Offensive" (yellow)
    const isDamageStat = (name) => /Damage|Critical Hit/i.test(name);
    ["Offensive", "Defensive", "Utility"].forEach((cat) => {
      const entries = Object.entries(result.stats[cat]);
      cols.push({
        title: cat + " Stats",
        rows: entries.length ? entries.map(([k, v]) => [
          k, (v > 0 ? "+" : "") + (Math.round(v * 10) / 10) + (Number.isInteger(v) && Math.abs(v) > 1000 ? "" : ""),
          cat === "Offensive" ? (isDamageStat(k) ? "var(--red)" : "var(--yellow)") : null,
        ]) : [["Nothing equipped yet", "—"]],
      });
    });
    cols.push(weaponCol(WEAPON_SLOTS[1]), weaponCol(WEAPON_SLOTS[2]));
    document.getElementById("depthTables").innerHTML = cols.map((c) =>
      '<div class="depth-col"><div class="grid-block-head" style="font-size:13px">' + c.title + '</div>' +
      c.rows.map((r) => '<div class="readout-row" style="padding:7px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-size:12.5px"><span style="color:' + (r[2] || "var(--muted)") + '">' + r[0] + '</span><span style="font-family:var(--font-mono)">' + r[1] + '</span></div>').join("") +
      '</div>'
    ).join("");

    // full talents & bonuses: any gear piece whose brand has an active set/brand bonus box
    // has its own talent nested inside that box (grouped by the piece that grants it),
    // matching how the game presents brand bonuses alongside that brand's item talents.
    // Exotic pieces are always standalone — "Exotic" isn't a real brand grouping.
    const progress = Engine.brandProgress({ gear: state.gear });
    const boxedBrands = new Set(progress.filter((p) => p.active.length && p.brand !== "Exotic").map((p) => p.brand));
    const standaloneTalents = [];
    const talentsByBrand = {};
    WEAPON_SLOTS.forEach((s) => {
      const w = state.weapons[s.key];
      if (w && w.talent) standaloneTalents.push({ name: w.talent.Name, desc: w.talent.Desc, source: s.label + " Weapon", quality: w.quality });
    });
    GEAR_SLOTS.forEach((s) => {
      const g = state.gear[s.key];
      if (g && g.talent) {
        const entry = { name: g.talent.Talent, desc: g.talent.Desc, source: s.key, quality: g.quality };
        if (boxedBrands.has(g.brand)) (talentsByBrand[g.brand] = talentsByBrand[g.brand] || []).push(entry);
        else standaloneTalents.push(entry);
      }
    });
    const sortedStandalone = sortByQuality(standaloneTalents, (t) => t.quality, (t) => t.name);
    const setBoxes = progress.filter((p) => p.active.length).map((p) => ({
      brand: p.brand, count: p.count, boosted: p.boosted, isGearset: p.isGearset,
      bonus: p.active.join("\n"), talents: talentsByBrand[p.brand] || [],
    })).sort((a, b) => (b.isGearset - a.isGearset) || a.brand.localeCompare(b.brand));

    let html = "";
    html += setBoxes.map((b) =>
      '<div class="depth-talent-row depth-set-box ' + (b.isGearset ? "is-gearset" : "is-brand") + '"><div class="dt-top"><span class="dt-name">' + b.brand + ' Set Bonus</span><span class="dt-source">' + b.count + 'pc</span></div>' +
      (b.boosted ? '<div class="dt-boost">Boosted to ' + b.count + 'pc by NinjaBike Messenger Bag</div>' : "") +
      '<div class="dt-desc">' + compactDesc(b.bonus) + '</div>' +
      (b.talents.length ? '<div class="dt-subtalents">' + b.talents.map((t) =>
        '<div class="dt-sub"><div class="dt-top"><span class="dt-sub-name">' + t.name + '</span><span class="dt-source">' + t.source + '</span></div><div class="dt-desc">' + compactDesc(t.desc) + '</div></div>'
      ).join("") + '</div>' : "") +
      '</div>'
    ).join("");
    html += sortedStandalone.map((t) => '<div class="depth-talent-row"><div class="dt-top"><span class="dt-name">' + t.name + '</span><span class="dt-source">' + t.source + '</span></div><div class="dt-desc">' + compactDesc(t.desc) + '</div></div>').join("");
    document.getElementById("depthTalents").innerHTML = html || '<div class="empty-inline">No talents or set bonuses active yet.</div>';
  }

  function renderWeaponGrid() {
    const el = document.getElementById("weaponGrid");
    el.innerHTML = WEAPON_SLOTS.map((s) => {
      const item = state.weapons[s.key];
      const q = item ? " q-" + qClass(item.quality) : "";
      let talentHtml = "";
      if (item) {
        if (item.talent) talentHtml = talentBlock(item.talent.Name, item.talent.Desc);
        else if (item.talentAssumed) talentHtml = '<button class="tile-pick-talent" data-pick-weapon-talent="' + s.key + '">Choose Talent →</button>';
      }
      return '<div class="item-tile' + q + '" data-weapon-slot="' + s.key + '">' +
        (item ? '<button class="tile-unequip" data-unequip-weapon="' + s.key + '" title="Unequip">✕</button>' : "") +
        '<div class="tile-top">' + img("ui", s.icon, "tile-icon") + '<span class="tile-label">' + s.label + '</span>' +
          '<span class="tile-name-inline' + (item ? "" : " placeholder") + '">' + (item ? item.name + (item.variant !== item.name ? " (" + item.variant + ")" : "") : "Choose weapon") + '</span>' +
          (item ? '<span class="tile-subtype">' + item.weaponType + '</span>' : "") +
          (item ? '<span class="qtag q-' + qClass(item.quality) + '">' + item.quality + '</span>' : "") +
        '</div>' +
        (item ? weaponRollRowsHtml(item, s.key) : "") + talentHtml +
        '</div>';
    }).join("");
    el.querySelectorAll("[data-weapon-slot]").forEach((elm) => elm.addEventListener("click", () => openWeaponPicker(elm.dataset.weaponSlot)));
    // the whole tile opens the picker, so every interactive control inside it must stop the
    // click from bubbling there — selects/inputs open/type as normal instead of also popping the picker
    el.querySelectorAll(".roll-select, .roll-input, .attach-select").forEach((elm) => elm.addEventListener("click", (e) => e.stopPropagation()));
    el.querySelectorAll("[data-pick-weapon-talent]").forEach((elm) => elm.addEventListener("click", (e) => { e.stopPropagation(); openWeaponTalentPicker(elm.dataset.pickWeaponTalent); }));
    el.querySelectorAll("[data-unequip-weapon]").forEach((elm) => elm.addEventListener("click", (e) => { e.stopPropagation(); state.weapons[elm.dataset.unequipWeapon] = null; renderInventory(); }));
    el.querySelectorAll(".roll-select").forEach((sel) => sel.addEventListener("change", (e) => {
      const field = sel.dataset.rollField, weaponKey = sel.dataset.rollSlot;
      const item = state.weapons[weaponKey];
      const pool = Engine.weaponAttributePool(null);
      const chosen = pool[+sel.value];
      if (!chosen) return;
      item[field] = { Stat: chosen.Stat, Max: Number(chosen.Max), Type: chosen.Type, value: Number(chosen.Max), selectable: true };
      renderInventory();
    }));
    el.querySelectorAll(".roll-input").forEach((inp) => inp.addEventListener("change", () => {
      const field = inp.dataset.rollValue, weaponKey = inp.dataset.rollSlot;
      const slot = state.weapons[weaponKey][field];
      const max = slot.Max != null ? slot.Max : slot.max;
      let v = Number(inp.value);
      if (isNaN(v)) v = max;
      slot.value = Math.max(0, Math.min(max, v));
      renderInventory();
    }));
    el.querySelectorAll("[data-attach-toggle]").forEach((btn) => btn.addEventListener("click", (e) => {
      e.stopPropagation();
      attachExpanded[btn.dataset.attachToggle] = !attachExpanded[btn.dataset.attachToggle];
      renderInventory();
    }));
    el.querySelectorAll(".attach-select").forEach((sel) => sel.addEventListener("change", (e) => {
      const field = sel.dataset.attachField, weaponKey = sel.dataset.attachSlot;
      const item = state.weapons[weaponKey];
      const cfg = ATTACH_SLOTS.find(([key]) => key === field);
      const pool = Engine.weaponModPool(cfg[1], item.raw[cfg[2]]);
      const chosen = pool[+sel.value];
      if (!chosen) return;
      item.mods[field] = {
        slot: cfg[1], name: chosen.Name, type: chosen.Type,
        pos: chosen.pos || null, valPos: Number(chosen.valPos) || 0,
        neg: chosen.neg || null, valNeg: Number(chosen.valNeg) || 0,
        selectable: true,
      };
      renderInventory();
    }));
  }

  // ---- inline roll editors for equipped weapons: Core 1 (always the weapon-type's own
  // damage stat) and Core 2 (a fixed per-weapon-type default, e.g. SMG=Crit, LMG=DTOC) are
  // both value-overridable but not reroll-able; Attribute 1 can be rerolled when generic. ----
  function weaponRollRow(item, field, kind, weaponKey) {
    const slot = item[field];
    if (!slot) return "";
    const iconSrc = Engine.slotTypeIcon(kind, slot.Type);
    const iconHtml = iconSrc ? '<img class="roll-icon' + (field === "core1" ? " roll-icon-lg" : "") + '" src="' + iconSrc + '" alt="">' : "";
    const max = slot.Max != null ? slot.Max : slot.max;
    // primary (core) and secondary (attribute) rolls are always colored by stat type
    // (red/blue/yellow), same convention as everywhere else in the app
    const colorStyle = ' style="color:' + (STAT_TYPE_COLOR[slot.Type] || "var(--text)") + '"';
    let bodyHtml;
    if (field === "attribute1" && slot.selectable) {
      const pool = Engine.weaponAttributePool(null);
      bodyHtml = '<select class="roll-select"' + colorStyle + ' data-roll-field="' + field + '" data-roll-slot="' + weaponKey + '">' +
        pool.map((o, i) => '<option value="' + i + '"' + (o.Stat === slot.Stat ? " selected" : "") + '>' + o.Stat + '</option>').join("") +
        '</select>';
    } else {
      bodyHtml = '<span class="roll-label-fixed"' + colorStyle + '>' + (slot.stat || slot.Stat) + '</span>';
    }
    return '<div class="roll-row">' + iconHtml + bodyHtml +
      '<input type="number" class="roll-input" min="0" max="' + max + '" value="' + slot.value + '" data-roll-value="' + field + '" data-roll-slot="' + weaponKey + '"></div>';
  }
  function weaponRollRowsHtml(item, weaponKey) {
    const fields = [["core1", "core"], ["core2", "core"], ["attribute1", "attribute"]];
    const rows = fields.map(([field, kind]) => weaponRollRow(item, field, kind, weaponKey)).join("");
    return '<div class="roll-rows">' + rows + '</div>' + weaponAttachmentsHtml(item, weaponKey);
  }

  // ---- weapon attachments (Optic / Under Barrel / Magazine / Muzzle): unlike core/attribute
  // rolls the bonus VALUE is fixed by which attachment you pick, so each row is just an identity
  // choice (or fixed text when only one compatible option exists) plus its resulting bonus text.
  // Collapsed by default since most weapons have 4 of these and they're checked far less often. ----
  const ATTACH_SLOTS = [["optic", "Optic", "Optics"], ["underBarrel", "Under Barrel", "Under Barrel"], ["magazine", "Magazine", "Magazine"], ["muzzle", "Muzzle", "Muzzle"]];
  function attachBonusText(mod) {
    const parts = [];
    if (mod.pos) parts.push("+" + mod.valPos + " " + mod.pos);
    if (mod.neg) parts.push(mod.valNeg + " " + mod.neg);
    return parts.length ? parts.join(", ") : "No bonus";
  }
  function weaponAttachRow(item, key, engineSlot, rawCol, weaponKey) {
    const mod = item.mods[key];
    if (!mod) return "";
    let identityHtml;
    if (mod.selectable) {
      const pool = Engine.weaponModPool(engineSlot, item.raw[rawCol]);
      identityHtml = '<select class="attach-select" data-attach-field="' + key + '" data-attach-slot="' + weaponKey + '">' +
        pool.map((o, i) => '<option value="' + i + '"' + (o.Name === mod.name ? " selected" : "") + '>' + o.Name + '</option>').join("") +
        '</select>';
    } else {
      identityHtml = '<span class="roll-label-fixed">' + mod.name + '</span>';
    }
    return '<div class="roll-row"><span class="attach-slot-label">' + engineSlot + '</span>' + identityHtml + '<span class="attach-bonus">' + attachBonusText(mod) + '</span></div>';
  }
  function weaponAttachmentsHtml(item, weaponKey) {
    const rows = ATTACH_SLOTS.map(([key, engineSlot, rawCol]) => weaponAttachRow(item, key, engineSlot, rawCol, weaponKey)).join("");
    if (!rows) return "";
    const open = !!attachExpanded[weaponKey];
    return '<div class="attach-block">' +
      '<button type="button" class="attach-toggle" data-attach-toggle="' + weaponKey + '">Attachments<span class="attach-caret">' + (open ? "▾" : "▸") + '</span></button>' +
      '<div class="roll-rows attach-rows"' + (open ? "" : " hidden") + '>' + rows + '</div>' +
      '</div>';
  }

  function coreClass(item) { return item && item.core ? " core-" + item.core.Type : ""; }

  // ---- inline roll editors: core/attribute/mod identity (when choosable) + value override ----
  function attrOptionsFor(item, field) {
    const other = field === "attribute1" ? item.attribute2 : field === "attribute2" ? item.attribute1 : null;
    return Engine.attributePool(other ? other.Stat : null);
  }
  function modOptionsFor(item, field) {
    return Engine.modPool();
  }
  function rollRow(item, field, kind, gearKey) {
    const slot = item[field];
    if (!slot) return "";
    const iconSrc = Engine.slotTypeIcon(kind, slot.Type);
    const iconHtml = iconSrc ? '<img class="roll-icon' + (kind === "core" ? " roll-icon-lg" : "") + '" src="' + iconSrc + '" alt="">' : "";
    // primary (core) and secondary (attribute) rolls are always colored by stat type
    // (red/blue/yellow); mods aren't attributes, so they're left uncolored
    const colorStyle = kind !== "mod" ? ' style="color:' + (STAT_TYPE_COLOR[slot.Type] || "var(--text)") + '"' : "";
    let bodyHtml = "";
    if (kind === "core" && slot.selectable) {
      // Crafted/"Improvised" gear leaves its core type unrolled — the player picks it
      bodyHtml = '<select class="roll-select"' + colorStyle + ' data-roll-field="' + field + '" data-roll-slot="' + gearKey + '">' +
        Engine.CORE_ATTRIBUTES.map((o, i) => '<option value="' + i + '"' + (o.label === slot.label ? " selected" : "") + '>' + o.label + '</option>').join("") +
        '</select>';
    } else if (kind === "core") {
      // fixed by the item (Exotic only) - still label + color it, just no picker
      bodyHtml = '<span class="roll-label-fixed"' + colorStyle + '>' + slot.label + '</span>';
    } else if (slot.selectable) {
      const pool = kind === "mod" ? modOptionsFor(item, field) : attrOptionsFor(item, field);
      bodyHtml = '<select class="roll-select"' + colorStyle + ' data-roll-field="' + field + '" data-roll-slot="' + gearKey + '">' +
        pool.map((o, i) => '<option value="' + i + '"' + (o.Stat === slot.Stat ? " selected" : "") + '>' + o.Stat + '</option>').join("") +
        '</select>';
    } else {
      bodyHtml = '<span class="roll-label-fixed"' + colorStyle + '>' + slot.Stat + '</span>';
    }
    return '<div class="roll-row">' + iconHtml + bodyHtml +
      '<input type="number" class="roll-input" min="0" max="' + slot.Max + '" value="' + slot.value + '" data-roll-value="' + field + '" data-roll-slot="' + gearKey + '"></div>';
  }
  function rollRowsHtml(item, gearKey) {
    const fields = [
      ["core", "core"], ["coreTwo", "core"], ["coreThree", "core"],
      ["attribute1", "attribute"], ["attribute2", "attribute"], ["attribute3", "attribute"],
      ["mod", "mod"], ["modTwo", "mod"],
    ];
    const rows = fields.map(([field, kind]) => rollRow(item, field, kind, gearKey)).join("");
    return '<div class="roll-rows">' + rows + '</div>';
  }

  // this piece's own share of base armor (Base + Expertise only - no attributes/cores, those
  // already show up in the roll rows and the Total Armor % strip separately)
  function gearExpertiseRowHtml(slotKey) {
    const lvl = state.gearExpertise[slotKey] != null ? state.gearExpertise[slotKey] : state.expertise;
    const armor = Engine.gearPieceArmor(lvl);
    return '<div class="gear-exp-row">' +
      '<span class="gear-exp-armor">+' + armor.toLocaleString() + ' Armor</span>' +
      '<span class="gear-exp-field">EXP <input type="number" class="gear-exp-input" min="0" max="30" value="' + lvl + '" data-gear-exp="' + slotKey + '"></span>' +
    '</div>';
  }

  function renderGearGrid() {
    const el = document.getElementById("gearGrid");
    el.innerHTML = GEAR_SLOTS.map((s) => {
      const item = state.gear[s.key];
      const q = item ? " q-" + qClass(item.quality) : "";
      let talentHtml = "";
      if (item) {
        if (item.talent) talentHtml = talentBlock(item.talent.Talent, item.talent.Desc);
        else if (item.talentAssumed) talentHtml = '<button class="tile-pick-talent" data-pick-gear-talent="' + s.key + '">Choose Talent →</button>';
      }
      return '<div class="item-tile' + coreClass(item) + q + '" data-gear-slot="' + s.key + '">' +
        (item ? '<button class="tile-unequip" data-unequip-gear="' + s.key + '" title="Unequip">✕</button>' : "") +
        '<div class="tile-top">' + img("ui", s.icon, "tile-icon") + '<span class="tile-label">' + s.key + '</span>' +
          '<span class="tile-name-inline' + (item ? "" : " placeholder") + '">' + (item ? item.name : "Choose " + s.key.toLowerCase()) + '</span>' +
          (item ? '<span class="tile-subtype">' + item.brand + '</span>' : "") +
          (item ? '<span class="qtag q-' + qClass(item.quality) + '">' + item.quality + '</span>' : "") +
        '</div>' +
        (item ? gearExpertiseRowHtml(s.key) : "") +
        (item ? rollRowsHtml(item, s.key) : "") + talentHtml +
        '</div>';
    }).join("");
    el.querySelectorAll("[data-gear-slot]").forEach((elm) => elm.addEventListener("click", () => openGearPicker(elm.dataset.gearSlot)));
    el.querySelectorAll(".roll-select, .roll-input, .gear-exp-row").forEach((elm) => elm.addEventListener("click", (e) => e.stopPropagation()));
    el.querySelectorAll(".gear-exp-input").forEach((inp) => inp.addEventListener("change", () => setGearExpertise(inp.dataset.gearExp, Number(inp.value))));
    el.querySelectorAll("[data-pick-gear-talent]").forEach((elm) => elm.addEventListener("click", (e) => { e.stopPropagation(); openGearTalentPicker(elm.dataset.pickGearTalent); }));
    el.querySelectorAll("[data-unequip-gear]").forEach((elm) => elm.addEventListener("click", (e) => {
      e.stopPropagation();
      state.gear[elm.dataset.unequipGear] = null;
      delete state.gearExpertise[elm.dataset.unequipGear];
      saveGearExpertise();
      renderInventory();
    }));
    el.querySelectorAll(".roll-select").forEach((sel) => sel.addEventListener("change", (e) => {
      const field = sel.dataset.rollField, gearKey = sel.dataset.rollSlot;
      const item = state.gear[gearKey];
      const kind = /core/i.test(field) ? "core" : /mod/i.test(field) ? "mod" : "attribute";
      const pool = kind === "core" ? Engine.CORE_ATTRIBUTES : kind === "mod" ? modOptionsFor(item, field) : attrOptionsFor(item, field);
      const chosen = pool[+sel.value];
      if (!chosen) return;
      if (kind === "core") item[field] = { label: chosen.label, Max: chosen.Max, Type: chosen.Type, value: chosen.Max, selectable: true };
      else item[field] = { Stat: chosen.Stat, Max: Number(chosen.Max), Type: chosen.Type, value: Number(chosen.Max), selectable: true };
      renderInventory();
    }));
    el.querySelectorAll(".roll-input").forEach((inp) => inp.addEventListener("change", () => {
      const field = inp.dataset.rollValue, gearKey = inp.dataset.rollSlot;
      const slot = state.gear[gearKey][field];
      let v = Number(inp.value);
      if (isNaN(v)) v = slot.Max;
      slot.value = Math.max(0, Math.min(slot.Max, v));
      renderInventory();
    }));
  }

  function renderSkillGrid() {
    const el = document.getElementById("skillGrid");
    const specPerks = state.spec ? (DATA.specialization.find((s) => s.name === state.spec) || {}).perks || [] : [];
    el.innerHTML =
      '<div class="item-tile" data-spec="1"><div class="tile-top"><span class="tile-label">Specialization</span></div>' +
      '<div class="tile-name' + (state.spec ? "" : " placeholder") + '">' + (state.spec || "Choose specialization") + '</div>' +
      (specPerks.length ? '<div class="tile-meta">' + specPerks.slice(0, 2).map((p) => p.stat + " +" + p.val).join(", ") + '</div>' : "") + '</div>' +
      [1, 2].map((n) => {
        const item = state.skills[n];
        return '<div class="item-tile" data-skill="' + n + '"><div class="tile-top"><span class="tile-label">Skill ' + n + '</span></div>' +
          '<div class="tile-name' + (item ? "" : " placeholder") + '">' + (item ? item.name + " (" + item.variant + ")" : "Choose skill") + '</div>' + '</div>';
      }).join("");
    document.querySelector('[data-spec]').addEventListener("click", openSpecPicker);
    el.querySelectorAll("[data-skill]").forEach((elm) => elm.addEventListener("click", () => openSkillPicker(elm.dataset.skill)));
  }

  function renderInventory() { renderStatSummary(); renderAttributeStrip(); renderQualityStrip(); renderLoadoutSettings(); renderWeaponGrid(); renderGearGrid(); renderSkillGrid(); renderDepthTables(); updateUrl(); }

  // =================== PICKER (shared, with real resolved attributes shown) ===================
  const dialog = document.getElementById("pickerDialog");
  document.getElementById("pickerClose").addEventListener("click", () => dialog.close());

  // fixed secondary attributes are shown by name (they're real, known values); selectable ones
  // are lumped into a plain count instead of naming one auto-picked guess - the actual pick
  // happens after equipping, same reasoning as the mod-slot tag above.
  function secondaryAttrsHtml(slots) {
    const present = slots.filter(Boolean);
    const fixed = present.filter((a) => !a.selectable);
    const selectableCount = present.length - fixed.length;
    const parts = fixed.map((a) => '<span>' + compactDesc(a.Stat + " +" + a.Max) + '</span>');
    if (selectableCount) parts.push('<span>' + selectableCount + " Secondary Attribute" + (selectableCount > 1 ? "s" : "") + '</span>');
    return parts.join("");
  }
  // a brand or gearset's full tier list (1pc..6pc), for previewing what equipping this piece
  // works toward before you commit to it.
  function brandTierSummary(brand) {
    const tiers = [];
    for (let t = 0; t < 6; t++) {
      const found = DATA.brandSetBonuses.find((b) => b.Brand === brand + t);
      if (!found) continue;
      tiers.push((t + 1) + "pc: " + (found.stat === "Talent" ? found.Talent : found.stat + " +" + found.val + (found.stat1 ? ", " + found.stat1 + " +" + found.val1 : "")));
    }
    return tiers;
  }
  function weaponRowHtml(w) {
    const cores = [w.core1.max + "% " + w.core1.stat];
    if (w.core2 && w.core2.stat) cores.push(w.core2.max + "% " + w.core2.stat);
    const attrs = ['<span>' + compactDesc(cores.join(", ")) + '</span>'];
    attrs.push(secondaryAttrsHtml([w.attribute1]));
    return '<span class="piname">' + w.name + (w.variant !== w.name ? " (" + w.variant + ")" : "") + '</span>' +
      '<span class="piquality"><span class="qtag q-' + qClass(w.quality) + '">' + w.quality + '</span> ' + w.weaponType + '</span>' +
      '<span class="piattrs">' + attrs.join("") + '</span>' +
      (w.talent ? '<span class="pitalent">' + talentBlock(w.talent.Name, w.talent.Desc) + '</span>' : w.talentAssumed ? '<span class="pitalent assumed">Any talent — choose after equipping</span>' : "");
  }
  function gearRowHtml(g) {
    const attrs = [];
    attrs.push('<span>Core: ' + g.core.label + '</span>');
    if (g.coreTwo) attrs.push('<span>Core 2: ' + g.coreTwo.label + '</span>');
    if (g.coreThree) attrs.push('<span>Core 3: ' + g.coreThree.label + '</span>');
    attrs.push(secondaryAttrsHtml([g.attribute1, g.attribute2, g.attribute3]));
    // every mod slot is player-choosable (not fixed like a named/exotic attribute can be), so
    // showing one specific auto-picked stat here would misleadingly read as fixed - just flag
    // that the slot exists; the actual pick happens after equipping.
    attrs.push(g.mod
      ? '<span class="mod-slot-tag">' + img("ui", "blank_mod.png", "mod-slot-icon") + 'Has Mod Slot</span>'
      : '<span>No Mod Slot</span>');
    if (g.modTwo) attrs.push('<span class="mod-slot-tag">' + img("ui", "blank_mod.png", "mod-slot-icon") + 'Has 2nd Mod Slot</span>');
    const tiers = brandTierSummary(g.brand);
    const tierHtml = tiers.length
      ? '<span class="pi-tiers ' + (g.quality === "Gearset" ? "is-gearset" : "is-brand") + '">' + tiers.map((t) => compactDesc(t)).join("<br>") + '</span>'
      : "";
    return '<span class="piname">' + g.name + '</span>' +
      '<span class="piquality"><span class="qtag q-' + qClass(g.quality) + '">' + g.quality + '</span></span>' +
      '<span class="piattrs">' + attrs.join("") + '</span>' +
      tierHtml +
      (g.talent ? '<span class="pitalent">' + talentBlock(g.talent.Talent, g.talent.Desc) + '</span>' : g.talentAssumed ? '<span class="pitalent assumed">Any talent — choose after equipping</span>' : "");
  }

  function openPicker(title, rawItems, resolveFn, rowHtmlFn, onPick, opts) {
    opts = opts || {};
    document.getElementById("pickerTitle").textContent = title;
    const listEl = document.getElementById("pickerList");
    const searchEl = document.getElementById("pickerSearch");
    const catsEl = document.getElementById("pickerCats");
    searchEl.value = "";
    let activeCat = null;

    // search everything a card COULD tell you, not just the raw CSV columns and not just
    // what that particular card happens to render - resolve every item once up front and
    // index its rendered card text (name/quality/type/talent/mods/etc, all already assembled
    // by rowHtmlFn) plus, for gear, the full brand/gearset tier list (1pc..6pc) even though a
    // single piece's card only ever shows its own tiers-reached-so-far preview.
    const corpusByItem = new Map(rawItems.map((it) => {
      const resolved = resolveFn(it);
      const extra = resolved.brand ? brandTierSummary(resolved.brand).join(" ") : "";
      return [it, (stripHtml(rowHtmlFn(resolved)) + " " + extra + " " + JSON.stringify(it)).toLowerCase()];
    }));

    function currentItems() {
      return activeCat ? rawItems.filter((it) => opts.categorize(it) === activeCat) : rawItems;
    }
    function draw(filter) {
      const f = filter.toLowerCase();
      const base = currentItems();
      const filtered = f ? base.filter((it) => corpusByItem.get(it).includes(f)) : base;
      const resolved = filtered.slice(0, 150).map(resolveFn);
      listEl.innerHTML = resolved.length ? resolved.map((it, i) => '<div class="pitem' + (it.quality ? " q-" + qClass(it.quality) : "") + '" data-i="' + i + '">' + rowHtmlFn(it) + '</div>').join("") : '<div class="empty-note">No matches.</div>';
      listEl.querySelectorAll(".pitem").forEach((elm) => {
        elm.addEventListener("click", (e) => { onPick(resolved[+elm.dataset.i], e); dialog.close(); renderInventory(); });
      });
    }
    if (opts.categories) {
      catsEl.hidden = false;
      catsEl.innerHTML = '<button class="picker-cat active" data-cat="">All</button>' +
        opts.categories.map((c) => '<button class="picker-cat" data-cat="' + c + '">' + c + '</button>').join("");
      catsEl.querySelectorAll(".picker-cat").forEach((btn) => btn.addEventListener("click", () => {
        activeCat = btn.dataset.cat || null;
        catsEl.querySelectorAll(".picker-cat").forEach((b) => b.classList.toggle("active", b === btn));
        draw(searchEl.value);
      }));
    } else {
      catsEl.hidden = true;
      catsEl.innerHTML = "";
    }
    draw("");
    searchEl.oninput = () => draw(searchEl.value);
    dialog.showModal();
    listEl.scrollTop = 0;
    searchEl.focus();
  }

  function openWeaponPicker(slotKey) {
    const cfg = WEAPON_SLOTS.find((s) => s.key === slotKey);
    let pool = DATA.weapons.filter((w) => w.Slot === cfg.slot);
    if (hasExoticWeaponElsewhere(slotKey)) pool = pool.filter((w) => w.Quality !== "Exotic");
    const items = sortByQuality(pool, (w) => w.Quality, (w) => w.Name);
    // sidearms are pistol-only, so a category picker would be pointless there. And Primary/
    // Secondary can never contain a Pistol (filtered out by cfg.slot above), so build the
    // category list from what's actually in this pool rather than the full WEAPON_TYPES list -
    // otherwise a dead "Pistol" tab shows up that always renders "No matches."
    const availableTypes = WEAPON_TYPES.filter((t) => pool.some((w) => w["Weapon Type"] === t));
    const opts = cfg.slot === "S" ? {} : { categories: availableTypes, categorize: (w) => w["Weapon Type"] };
    openPicker("Select " + cfg.label, items, Engine.resolveWeapon, weaponRowHtml, (w) => { state.weapons[slotKey] = w; }, opts);
  }
  function openGearPicker(slot) {
    let pool = DATA.gear[slot];
    if (hasExoticGearElsewhere(slot)) pool = pool.filter((g) => g.Quality !== "Exotic");
    openPicker("Select " + slot, sortByQuality(pool, (g) => g.Quality, (g) => g["Item Name"]), Engine.resolveGear, gearRowHtml, (g, e) => {
      state.gear[slot] = g;
      delete state.gearExpertise[slot];
      // shift+click a gearset piece: fill every still-empty gear slot with that same
      // gearset's piece too, for fast full-set equipping. Slots already holding something
      // are left alone - this only ever fills gaps, never replaces a deliberate choice.
      if (e && e.shiftKey && g.quality === "Gearset") {
        GEAR_SLOTS.forEach((s2) => {
          if (s2.key === slot || state.gear[s2.key]) return;
          const raw = DATA.gear[s2.key].find((row) => row.Brand === g.brand && row.Quality === "Gearset");
          if (raw) { state.gear[s2.key] = Engine.resolveGear(raw); delete state.gearExpertise[s2.key]; }
        });
      }
      saveGearExpertise();
    });
  }
  function openSkillPicker(n) {
    const items = [...DATA.skills].sort((a, b) => a["Item Name"].localeCompare(b["Item Name"]) || a.Variant.localeCompare(b.Variant));
    openPicker("Select Skill", items, Engine.resolveSkill,
      (s) => '<span class="piname">' + s.name + ' (' + s.variant + ')</span><span class="piquality"></span>' + (s.desc ? '<span class="piattrs">' + s.desc.slice(0, 90) + '…</span>' : ""),
      (s) => { state.skills[n] = s; });
  }
  function openSpecPicker() {
    openPicker("Select Specialization", DATA.specialization, (s) => s,
      (s) => '<span class="piname">' + s.name + '</span><span class="piquality"></span><span class="piattrs">' + s.perks.map((p) => p.stat + " +" + p.val).join(", ") + '</span>',
      (s) => { state.spec = s.name; });
  }
  function talentPickerRow(name, desc) {
    return '<span class="piname">' + name + '</span><span class="piquality"></span><span class="pitalent"><span class="tt-desc">' + compactDesc(desc) + '</span></span>';
  }
  function openWeaponTalentPicker(slotKey) {
    const weapon = state.weapons[slotKey];
    const items = DATA.weaponTalents.filter((t) => t.Quality === "A" && t[weapon.weaponType] === "x");
    openPicker("Choose Talent for " + weapon.name, items, (t) => t,
      (t) => talentPickerRow(t.Name, t.Desc),
      (t) => { state.weapons[slotKey].talent = t; state.weapons[slotKey].talentAssumed = false; });
  }
  function openGearTalentPicker(slot) {
    const gear = state.gear[slot];
    const items = DATA.gearTalents.filter((t) => t.Quality === "A" && t.Slot === slot);
    openPicker("Choose Talent for " + gear.name, items, (t) => t,
      (t) => talentPickerRow(t.Talent, t.Desc),
      (t) => { state.gear[slot].talent = t; state.gear[slot].talentAssumed = false; });
  }
  document.getElementById("clearBtn").addEventListener("click", () => { state.weapons = {}; state.gear = {}; state.skills = {}; state.spec = null; state.gearExpertise = {}; saveGearExpertise(); renderInventory(); });

  // changing the shared level always wins over any per-piece override, on the theory that
  // touching this control means "set everything to this" - see loadGearExpertise() above.
  function setExpertise(v) {
    if (isNaN(v)) v = 30;
    state.expertise = Math.max(0, Math.min(30, v));
    state.gearExpertise = {};
    saveExpertise();
    saveGearExpertise();
    renderInventory();
  }
  document.getElementById("expertiseInput").addEventListener("change", (e) => setExpertise(Number(e.target.value)));
  document.getElementById("expertiseDown").addEventListener("click", () => setExpertise(state.expertise - 1));
  document.getElementById("expertiseUp").addEventListener("click", () => setExpertise(state.expertise + 1));
  function setGearExpertise(slot, v) {
    if (isNaN(v)) v = state.expertise;
    state.gearExpertise[slot] = Math.max(0, Math.min(30, v));
    saveGearExpertise();
    renderInventory();
  }

  // SHD Watch quick toggle — flips all 16 levels to max or to 0 at once; fine-tuning
  // individual levels still lives on the SHD Watch tab.
  document.getElementById("shdToggle").addEventListener("change", (e) => {
    state.shd.forEach((l) => (l.value = e.target.checked ? l.max : 0));
    saveSHD();
    renderInventory();
  });
  function renderLoadoutSettings() {
    document.getElementById("expertiseInput").value = state.expertise;
    const allMax = state.shd.every((l) => l.value === l.max);
    document.getElementById("shdToggle").checked = allMax;
    document.getElementById("shdToggleText").textContent = allMax ? "ON" : "OFF";
  }

  // =================== LIBRARY ===================
  function libCounts(list) {
    const byQ = {};
    list.forEach((it) => (byQ[it.Quality] = (byQ[it.Quality] || 0) + 1));
    return byQ;
  }
  function countsLine(byQ) {
    return highlightKeywords(Object.entries(byQ).map(([q, n]) => n + " " + q).join(" · "));
  }
  let libSelected = null;
  function renderLibrary() {
    document.getElementById("libWeaponCats").innerHTML = WEAPON_TYPES.map((t) => {
      const list = DATA.weapons.filter((w) => w["Weapon Type"] === t);
      return '<div class="lib-tile' + (libSelected && libSelected.kind === "weapon" && libSelected.key === t ? " active" : "") + '" data-wtype="' + t + '">' +
        img("ui", "main-weapon.png") + '<div><div class="lname">' + t + '</div><div class="lcount">' + list.length + ' catalogued · ' + countsLine(libCounts(list)) + '</div></div></div>';
    }).join("");
    document.getElementById("libGearCats").innerHTML = GEAR_SLOTS.map((s) => {
      const list = DATA.gear[s.key].filter(isArmorCatalogItem);
      return '<div class="lib-tile' + (libSelected && libSelected.kind === "gear" && libSelected.key === s.key ? " active" : "") + '" data-gtype="' + s.key + '">' +
        img("ui", s.icon) + '<div><div class="lname">' + s.key + '</div><div class="lcount">' + list.length + ' catalogued · ' + countsLine(libCounts(list)) + '</div></div></div>';
    }).join("");
    document.getElementById("libBrandCats").innerHTML = REGULAR_BRANDS.map((b) => {
      const count = GEAR_SLOTS.reduce((n, s) => n + DATA.gear[s.key].filter((g) => g.Brand === b).length, 0);
      return '<div class="lib-tile' + (libSelected && libSelected.kind === "brand" && libSelected.key === b ? " active" : "") + '" data-brand="' + b + '">' +
        img("brands", brandIcon(b)) + '<div><div class="lname">' + b + '</div><div class="lcount">' + count + ' pieces</div></div></div>';
    }).join("");
    document.getElementById("libGearsetCats").innerHTML = GEARSET_BRANDS.map((b) => {
      const count = GEAR_SLOTS.reduce((n, s) => n + DATA.gear[s.key].filter((g) => g.Brand === b).length, 0);
      return '<div class="lib-tile' + (libSelected && libSelected.kind === "gearset" && libSelected.key === b ? " active" : "") + '" data-gearset="' + b + '">' +
        img("brands", brandIcon(b)) + '<div><div class="lname">' + b + '</div><div class="lcount">' + count + ' pieces</div></div></div>';
    }).join("");
    document.getElementById("libTalentCats").innerHTML = TALENT_CATS.map((c, i) => {
      const count = talentsForCat(c).length;
      const icon = c.kind === "weapon" ? "main-weapon.png" : GEAR_SLOTS.find((s) => s.key === c.key).icon;
      return '<div class="lib-tile' + (libSelected && libSelected.kind === "talent" && libSelected.key === i ? " active" : "") + '" data-talent="' + i + '">' +
        img("ui", icon) + '<div><div class="lname">' + c.label + '</div><div class="lcount">' + count + ' talents</div></div></div>';
    }).join("");

    document.querySelectorAll("[data-wtype]").forEach((el) => el.addEventListener("click", () => { libSelected = { kind: "weapon", key: el.dataset.wtype }; renderLibrary(); }));
    document.querySelectorAll("[data-gtype]").forEach((el) => el.addEventListener("click", () => { libSelected = { kind: "gear", key: el.dataset.gtype }; renderLibrary(); }));
    document.querySelectorAll("[data-brand]").forEach((el) => el.addEventListener("click", () => { libSelected = { kind: "brand", key: el.dataset.brand }; renderLibrary(); }));
    document.querySelectorAll("[data-gearset]").forEach((el) => el.addEventListener("click", () => { libSelected = { kind: "gearset", key: el.dataset.gearset }; renderLibrary(); }));
    document.querySelectorAll("[data-talent]").forEach((el) => el.addEventListener("click", () => { libSelected = { kind: "talent", key: +el.dataset.talent }; renderLibrary(); }));

    const browseWrap = document.getElementById("libBrowseWrap");
    if (!libSelected) { browseWrap.innerHTML = ""; return; }
    if (libSelected.kind === "weapon" || libSelected.kind === "gear") { renderEquipBrowse(browseWrap); return; }
    if (libSelected.kind === "brand" || libSelected.kind === "gearset") { renderBrandBrowse(browseWrap, libSelected.key); return; }
    renderTalentBrowse(browseWrap, TALENT_CATS[libSelected.key]);
  }
  function renderEquipBrowse(browseWrap) {
    let items, resolveFn, rowFn;
    if (libSelected.kind === "weapon") {
      let pool = DATA.weapons.filter((w) => w["Weapon Type"] === libSelected.key);
      if (hasExoticWeaponElsewhere(null)) pool = pool.filter((w) => w.Quality !== "Exotic");
      items = sortByQuality(pool, (w) => w.Quality, (w) => w.Name);
      resolveFn = Engine.resolveWeapon; rowFn = weaponRowHtml;
    } else {
      let pool = DATA.gear[libSelected.key].filter(isArmorCatalogItem);
      if (hasExoticGearElsewhere(libSelected.key)) pool = pool.filter((g) => g.Quality !== "Exotic");
      items = sortByQuality(pool, (g) => g.Quality, (g) => g["Item Name"]);
      resolveFn = Engine.resolveGear; rowFn = gearRowHtml;
    }
    const resolved = items.map(resolveFn);
    browseWrap.innerHTML = '<div class="lib-browse-head"><h3>' + libSelected.key + ' Catalog</h3><span class="lcount">' + resolved.length + ' items</span></div>' +
      '<div class="grid-block"><div class="picker-list" style="max-height:none">' +
      resolved.map((it, i) => '<div class="pitem' + (it.quality ? " q-" + qClass(it.quality) : "") + '" data-i="' + i + '">' + rowFn(it) + '</div>').join("") + '</div></div>';
    browseWrap.querySelectorAll(".pitem").forEach((elm) => {
      elm.addEventListener("click", () => {
        const it = resolved[+elm.dataset.i];
        if (libSelected.kind === "weapon") {
          const target = it.slot === "S" ? "SideArm" : (state.weapons.Primary ? "Secondary" : "Primary");
          state.weapons[target] = it;
        } else {
          state.gear[libSelected.key] = it;
        }
        renderInventory();
        switchScreen("inventory");
      });
    });
  }
  function renderBrandBrowse(browseWrap, brand) {
    const tiers = [];
    for (let t = 0; t < 6; t++) {
      const found = DATA.brandSetBonuses.find((b) => b.Brand === brand + t);
      if (!found) continue;
      if (found.stat === "Talent") {
        const gt = DATA.gearTalents.find((x) => x.Talent === found.Talent);
        tiers.push({ n: t + 1, text: found.Talent, desc: gt ? gt.Desc : "" });
      } else {
        tiers.push({ n: t + 1, text: found.stat + " +" + found.val + (found.stat1 ? ", " + found.stat1 + " +" + found.val1 : ""), desc: "" });
      }
    }
    const pieces = [];
    GEAR_SLOTS.forEach((s) => DATA.gear[s.key].filter((g) => g.Brand === brand).forEach((g) => pieces.push({ slot: s.key, item: Engine.resolveGear(g) })));
    browseWrap.innerHTML = '<div class="lib-browse-head"><h3>' + brand + '</h3><span class="lcount">' + pieces.length + ' pieces</span></div>' +
      '<div class="grid-block"><div class="grid-block-head" style="font-size:13px">Set Bonus</div>' +
      (tiers.length ? tiers.map((t) => '<div class="brandset-row"><div class="bs-top"><span class="bs-name">' + t.n + 'pc</span></div><div class="bs-bonus">' + compactDesc(t.text) + (t.desc ? '<div style="margin-top:4px">' + compactDesc(t.desc) + '</div>' : "") + '</div></div>').join("") : '<div class="empty-inline">No set bonus data.</div>') +
      '</div>' +
      '<div class="grid-block"><div class="grid-block-head" style="font-size:13px">Pieces</div><div class="picker-list" style="max-height:none">' +
      pieces.map((p, i) => '<div class="pitem' + (p.item.quality ? " q-" + qClass(p.item.quality) : "") + '" data-i="' + i + '"><span class="piquality">' + p.slot + '</span>' + gearRowHtml(p.item) + '</div>').join("") +
      '</div></div>';
    browseWrap.querySelectorAll(".pitem").forEach((elm) => {
      elm.addEventListener("click", () => {
        const p = pieces[+elm.dataset.i];
        state.gear[p.slot] = p.item;
        renderInventory();
        switchScreen("inventory");
      });
    });
  }
  function renderTalentBrowse(browseWrap, cat) {
    const sorted = sortByQuality(talentsForCat(cat), (t) => t.Quality, (t) => cat.kind === "weapon" ? t.Name : t.Talent);
    browseWrap.innerHTML = '<div class="lib-browse-head"><h3>' + cat.label + ' Talents</h3><span class="lcount">' + sorted.length + ' talents</span></div>' +
      '<div class="grid-block"><div class="picker-list" style="max-height:none">' +
      sorted.map((t) => {
        const name = cat.kind === "weapon" ? t.Name : t.Talent;
        const on = cat.kind === "weapon" ? DATA.weapons.filter((w) => w.Talent === name).map((w) => w.Name) : (DATA.gear[cat.key] || []).filter((g) => g.Talent === name).map((g) => g["Item Name"]);
        const source = on.length ? "Rolls on: " + on.slice(0, 6).join(", ") + (on.length > 6 ? " +" + (on.length - 6) + " more" : "") : "Recalibration only";
        return '<div class="pitem q-' + qClass(t.Quality === "E" ? "Exotic" : t.Quality === "N" ? "Named" : t.Quality === "S" ? "Gearset" : "High End") + '">' +
          '<span class="piname">' + name + '</span><span class="piquality">' + t.Quality + '</span>' +
          '<span class="pitalent"><span class="tt-desc">' + compactDesc(t.Desc) + '</span></span>' +
          '<span class="piattrs">' + source + '</span></div>';
      }).join("") + '</div></div>';
  }

  // =================== SHD WATCH ===================
  function renderSHD() {
    const groups = ["Offense", "Handling", "Defense", "Utility"];
    const total = state.shd.reduce((a, l) => a + l.value, 0);
    const maxTotal = state.shd.reduce((a, l) => a + l.max, 0);
    document.getElementById("shdTotal").textContent = "SHD Watch — " + total + " / " + maxTotal + " points allocated";
    document.getElementById("shdGroups").innerHTML = groups.map((grp) =>
      '<div class="shd-group"><div class="shd-group-head">' + grp + '</div>' +
      state.shd.map((l, i) => l.group === grp ? { l, i } : null).filter(Boolean).map(({ l, i }) =>
        '<div class="shd-stat-row"><span class="shd-stat-name">' + l.name + '</span>' +
        '<input type="number" class="roll-input" min="0" max="' + l.max + '" value="' + l.value + '" data-shd-i="' + i + '">' +
        '<span class="shd-stat-max">/ ' + l.max + '</span></div>'
      ).join("") + '</div>'
    ).join("");
    document.querySelectorAll("[data-shd-i]").forEach((inp) => inp.addEventListener("change", () => {
      const i = +inp.dataset.shdI;
      let v = Number(inp.value);
      if (isNaN(v)) v = 0;
      state.shd[i].value = Math.max(0, Math.min(state.shd[i].max, v));
      saveSHD();
      renderInventory();
      renderSHD();
    }));
    document.getElementById("shdMaxAll").onclick = () => { state.shd.forEach((l) => (l.value = l.max)); saveSHD(); renderInventory(); renderSHD(); };
    document.getElementById("shdZeroAll").onclick = () => { state.shd.forEach((l) => (l.value = 0)); saveSHD(); renderInventory(); renderSHD(); };
  }

  // =================== nav ===================
  function switchScreen(name) {
    document.querySelectorAll(".screen").forEach((s) => (s.hidden = s.id !== "screen-" + name));
    document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t.dataset.screen === name));
    if (name === "library") renderLibrary();
    if (name === "shd") renderSHD();
  }
  document.getElementById("tabs").addEventListener("click", (e) => { if (e.target.dataset.screen) switchScreen(e.target.dataset.screen); });

  // =================== URL persistence: loadout survives reload / is shareable ===================
  // captures any deviation (identity choice and/or rolled value) from a fresh resolve of the same raw row
  function slotDiff(cur, base) {
    if (!cur) return null;
    const d = {};
    const curId = cur.Stat || cur.label, baseId = base && (base.Stat || base.label);
    if (curId !== baseId) d.s = curId;
    const max = cur.Max != null ? cur.Max : cur.max;
    if (cur.value !== max) d.v = cur.value;
    return Object.keys(d).length ? d : null;
  }
  function refWeapon(w) {
    if (!w) return null;
    const base = Engine.resolveWeapon(w.raw);
    const ref = { i: w.raw.index };
    if (w.talent && !w.talentAssumed) ref.t = w.talent.Name;
    const core1 = slotDiff(w.core1, base.core1); if (core1) ref.core1 = core1;
    const core2 = slotDiff(w.core2, base.core2); if (core2) ref.core2 = core2;
    const attribute1 = slotDiff(w.attribute1, base.attribute1); if (attribute1) ref.attribute1 = attribute1;
    const mods = {};
    ATTACH_SLOTS.forEach(([key]) => {
      const cur = w.mods[key], b = base.mods[key];
      if (cur && b && cur.name !== b.name) mods[key] = cur.name;
    });
    if (Object.keys(mods).length) ref.mods = mods;
    return ref;
  }
  function refGear(g) {
    if (!g) return null;
    const base = Engine.resolveGear(g.raw);
    const ref = { i: g.raw.index };
    if (g.talent && !g.talentAssumed) ref.t = g.talent.Talent;
    ["core", "coreTwo", "coreThree", "attribute1", "attribute2", "attribute3", "mod", "modTwo"].forEach((f) => {
      const d = slotDiff(g[f], base[f]);
      if (d) ref[f] = d;
    });
    return ref;
  }
  function serializeState() {
    const out = { w: {}, g: {}, sk: {} };
    WEAPON_SLOTS.forEach((s) => { const r = refWeapon(state.weapons[s.key]); if (r) out.w[s.key] = r; });
    GEAR_SLOTS.forEach((s) => { const r = refGear(state.gear[s.key]); if (r) out.g[s.key] = r; });
    [1, 2].forEach((n) => { if (state.skills[n]) out.sk[n] = state.skills[n].raw.index; });
    if (state.spec) out.sp = state.spec;
    const shdNonzero = state.shd.map((l, i) => (l.value ? [i, l.value] : null)).filter(Boolean);
    if (shdNonzero.length) out.shd = shdNonzero;
    if (state.expertise !== 30) out.exp = state.expertise;
    if (Object.keys(state.gearExpertise).length) out.gexp = state.gearExpertise;
    return out;
  }
  function updateUrl() {
    try {
      const data = serializeState();
      const hasAny = Object.keys(data.w).length || Object.keys(data.g).length || Object.keys(data.sk).length || data.sp || (data.shd && data.shd.length) || data.exp != null || data.gexp;
      const hash = hasAny ? "#b=" + encodeURIComponent(JSON.stringify(data)) : "";
      history.replaceState(null, "", location.pathname + location.search + hash);
    } catch (e) { /* URL persistence is a convenience, never block the app on it */ }
  }
  function applySlotRef(resolved, field, d, kind) {
    if (!d || !resolved[field]) return;
    if (d.s && kind !== "weaponCore") {
      let found = null;
      if (kind === "core") found = Engine.CORE_ATTRIBUTES.find((c) => c.label === d.s);
      else if (kind === "mod") found = DATA.gearMods.find((m) => m.Stat === d.s && m.Quality === "A");
      else if (kind === "weaponAttribute") found = DATA.weaponAttributes.find((a) => a.Stat === d.s && a.Quality === "A") || DATA.weaponAttributes.find((a) => a.Stat === d.s);
      else found = DATA.gearAttributes.find((a) => a.Stat === d.s && a.Quality === "A") || DATA.gearAttributes.find((a) => a.Stat === d.s);
      if (found) {
        if (kind === "core") resolved[field] = { label: found.label, Max: found.Max, Type: found.Type, value: found.Max, selectable: true };
        else resolved[field] = { Stat: found.Stat, Max: Number(found.Max), Type: found.Type, value: Number(found.Max), selectable: true };
      }
    }
    if (d.v != null) resolved[field].value = d.v;
  }
  function restoreFromUrl() {
    const m = location.hash.match(/^#b=(.+)$/);
    if (!m) return;
    let data;
    try { data = JSON.parse(decodeURIComponent(m[1])); } catch (e) { return; }
    WEAPON_SLOTS.forEach((s) => {
      const ref = data.w && data.w[s.key];
      if (!ref) return;
      const raw = DATA.weapons.find((w) => w.index === ref.i);
      if (!raw) return;
      const resolved = Engine.resolveWeapon(raw);
      if (ref.t) {
        const t = DATA.weaponTalents.find((x) => x.Name === ref.t);
        if (t) { resolved.talent = t; resolved.talentAssumed = false; }
      }
      applySlotRef(resolved, "core1", ref.core1, "weaponCore");
      applySlotRef(resolved, "core2", ref.core2, "weaponCore");
      applySlotRef(resolved, "attribute1", ref.attribute1, "weaponAttribute");
      if (ref.mods) {
        ATTACH_SLOTS.forEach(([key, engineSlot, rawCol]) => {
          const name = ref.mods[key];
          if (!name) return;
          const pool = Engine.weaponModPool(engineSlot, raw[rawCol]);
          const found = pool.find((m) => m.Name === name);
          if (found) resolved.mods[key] = {
            slot: engineSlot, name: found.Name, type: found.Type,
            pos: found.pos || null, valPos: Number(found.valPos) || 0,
            neg: found.neg || null, valNeg: Number(found.valNeg) || 0,
            selectable: true,
          };
        });
      }
      state.weapons[s.key] = resolved;
    });
    GEAR_SLOTS.forEach((s) => {
      const ref = data.g && data.g[s.key];
      if (!ref) return;
      const raw = DATA.gear[s.key].find((g) => g.index === ref.i);
      if (!raw) return;
      const resolved = Engine.resolveGear(raw);
      if (ref.t) {
        const t = DATA.gearTalents.find((x) => x.Slot === s.key && x.Talent === ref.t);
        if (t) { resolved.talent = t; resolved.talentAssumed = false; }
      }
      applySlotRef(resolved, "core", ref.core, "core");
      applySlotRef(resolved, "coreTwo", ref.coreTwo, "core");
      applySlotRef(resolved, "coreThree", ref.coreThree, "core");
      applySlotRef(resolved, "attribute1", ref.attribute1, "attribute");
      applySlotRef(resolved, "attribute2", ref.attribute2, "attribute");
      applySlotRef(resolved, "attribute3", ref.attribute3, "attribute");
      applySlotRef(resolved, "mod", ref.mod, "mod");
      applySlotRef(resolved, "modTwo", ref.modTwo, "mod");
      state.gear[s.key] = resolved;
    });
    if (data.sk) {
      Object.entries(data.sk).forEach(([n, idx]) => {
        const raw = DATA.skills.find((sk) => sk.index === idx);
        if (raw) state.skills[n] = Engine.resolveSkill(raw);
      });
    }
    if (data.sp) state.spec = data.sp;
    if (data.shd) data.shd.forEach(([i, v]) => { if (state.shd[i]) state.shd[i].value = Math.max(0, Math.min(state.shd[i].max, v)); });
    if (data.exp != null) state.expertise = Math.max(0, Math.min(30, Number(data.exp)));
    if (data.gexp) {
      state.gearExpertise = {};
      Object.entries(data.gexp).forEach(([slot, v]) => { state.gearExpertise[slot] = Math.max(0, Math.min(30, Number(v))); });
    }
  }

  restoreFromUrl();
  renderInventory();
})();
</script>
