<meta charset="utf-8">
<title>SHD Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a09; --panel: #14140f; --panel-2: #1c1c15; --line: #33321f;
    --text: #ece9df; --muted: #948f78; --accent: #f2711c; --accent-dim: #4a2a0d;
    --red: #cf3f2e; --blue: #3a86c8; --yellow: #e0b62f; --purple: #c084fc; --cyan: #22d3ee; --green: #4ade80; --amber: #f59e0b; --indigo: #818cf8;
    --q-exotic: #d9432e; --q-named: #e3a73b; --q-gearset: #2fa89c; --q-highend: #e3a73b; --q-named-text: #e85dae;
    --kw-exotic: #f2711c; --kw-named: #e85dae; --kw-highend: #e0b62f; --kw-amplify: #9dff1f; --kw-overcharge: #ff2ec4;
    --font-display: "Oswald", "Arial Narrow", sans-serif;
    --font-body: "Barlow", "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", "Consolas", monospace;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]):not([data-theme="light"]) {
      --bg: #eeece3; --panel: #ffffff; --panel-2: #f5f3e9; --line: #d8d4bf;
      --text: #201e15; --muted: #6b6752; --accent: #c05a12; --accent-dim: #f4ddc6;
      --kw-amplify: #5a8f00; --purple: #8b5cf6; --cyan: #0e7490; --green: #15803d; --amber: #b45309; --indigo: #4338ca; --kw-overcharge: #a3157f;
    }
  }
  :root[data-theme="light"] {
    --bg: #eeece3; --panel: #ffffff; --panel-2: #f5f3e9; --line: #d8d4bf;
    --text: #201e15; --muted: #6b6752; --accent: #c05a12; --accent-dim: #f4ddc6;
    --kw-amplify: #5a8f00; --kw-overcharge: #a3157f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); }
  ::selection { background: var(--accent); color: #0a0a09; }
  *:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app { max-width: 1320px; margin: 0 auto; padding-bottom: 40px; }

  nav.topbar {
    display: flex; align-items: center; justify-content: space-between; padding: 14px 24px;
    border-bottom: 2px solid var(--accent); background: var(--panel);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img { width: 26px; height: 26px; opacity: .9; }
  .brand .name { font-family: var(--font-display); font-weight: 600; font-size: 19px; letter-spacing: .04em; text-transform: uppercase; }
  .tabs { display: flex; gap: 4px; }
  .tab {
    font-family: var(--font-display); font-weight: 500; font-size: 14px; letter-spacing: .06em; text-transform: uppercase;
    padding: 9px 20px; background: transparent; border: none; color: var(--muted); cursor: pointer;
  }
  .tab.active { background: var(--accent); color: #140b03; }
  .tab:hover:not(.active) { color: var(--text); }
  .topbar-actions { display: flex; gap: 8px; }
  .btn-ghost {
    font-family: var(--font-mono); font-size: 11.5px; padding: 7px 12px; background: transparent;
    border: 1px solid var(--line); color: var(--muted); cursor: pointer;
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

  .screen { padding: 22px 24px; }
  .screen[hidden] { display: none; }

  /* ---------- INVENTORY ---------- */
  .inv-stack { display: flex; flex-direction: column; gap: 14px; }

  /* compact expandable stat summary — one toggle expands all three together */
  .stat-summary-wrap { background: var(--panel); border: 1px solid var(--line); }
  .stat-chips { display: grid; grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 700px) { .stat-chips { grid-template-columns: 1fr; } }
  .stat-chip { padding: 12px 16px; cursor: pointer; border-left: 1px solid var(--line); }
  .stat-chip:first-child { border-left: none; }
  .stat-chip:hover { background: var(--panel-2); }
  .stat-chip .sc-top { display: flex; justify-content: space-between; align-items: baseline; }
  .stat-chip .sc-label { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .stat-chip .sc-caret { color: var(--muted); font-family: var(--font-mono); font-size: 11px; transition: transform .15s; }
  .stat-summary-wrap.open .sc-caret { transform: rotate(180deg); color: var(--accent); }
  .stat-chip .sc-value { font-family: var(--font-display); font-size: 26px; font-weight: 600; margin-top: 2px; }
  .stat-chip .sc-sub { font-family: var(--font-mono); font-size: 11px; color: var(--accent); margin-left: 6px; }
  .stat-chip .sc-cap-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-left: 7px; vertical-align: middle; }
  .stat-detail-row .cap-badge {
    font-family: var(--font-mono); font-size: 9px; padding: 1px 5px; margin-left: 6px; background: var(--accent-dim);
    color: var(--accent); border-radius: 2px; text-transform: uppercase; letter-spacing: .04em;
  }
  .stat-details { grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); background: var(--panel-2); display: none; }
  .stat-summary-wrap.open .stat-details { display: grid; }
  .stat-detail-col { border-left: 1px solid var(--line); padding: 4px 0; }
  .stat-detail-col:first-child { border-left: none; }
  @media (max-width: 700px) { .stat-details { grid-template-columns: 1fr; } .stat-detail-col { border-left: none; border-top: 1px solid var(--line); } .stat-detail-col:first-child { border-top: none; } }
  .stat-detail-row { display: flex; justify-content: space-between; padding: 7px 16px; font-size: 12.5px; border-bottom: 1px solid var(--line); gap: 10px; }
  .stat-detail-row:last-child { border-bottom: none; }
  .stat-detail-row .label { color: var(--muted); }
  .stat-detail-row .value { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }

  /* slim exotic/named/gearset summary */
  .quality-strip {
    display: flex; flex-wrap: wrap; gap: 4px 18px; padding: 6px 4px; font-family: var(--font-mono); font-size: 11px;
  }
  .quality-strip .qs-empty { color: var(--muted); font-style: italic; }
  .quality-strip .qs-group { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
  .quality-strip .qs-label { color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-size: 10px; }
  .quality-strip .qs-exotic .qs-label, .quality-strip .qs-exotic .qs-item { color: var(--q-exotic); }
  .quality-strip .qs-named .qs-label, .quality-strip .qs-named .qs-item { color: var(--q-named-text); }
  .quality-strip .qs-gearset .qs-label, .quality-strip .qs-gearset .qs-item { color: var(--q-gearset); }
  .quality-strip .qs-item:not(:last-child)::after { content: ", "; color: var(--muted); }
  .quality-strip .qs-attr .qs-label { color: var(--muted); }
  .quality-strip .qs-attr .qs-item { color: var(--text); }

  /* ---------- loadout-wide settings: expertise stepper + SHD watch toggle ---------- */
  .loadout-settings { display: flex; flex-wrap: wrap; gap: 2px; background: var(--line); border: 1px solid var(--line); }
  .setting-card { flex: 1 1 240px; background: var(--panel); padding: 11px 16px; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .setting-head { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .setting-name { font-family: var(--font-display); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--text); }
  .setting-note { font-family: var(--font-body); font-size: 11px; color: var(--muted); }

  .stepper { display: flex; align-items: stretch; border: 1px solid var(--line); background: var(--panel-2); flex-shrink: 0; }
  .stepper-btn {
    width: 28px; background: none; border: none; color: var(--muted); font-family: var(--font-mono); font-size: 16px;
    cursor: pointer; line-height: 1; padding: 0;
  }
  .stepper-btn:hover { background: var(--accent-dim); color: var(--accent); }
  .stepper-btn:active { background: var(--accent); color: #140b03; }
  .stepper-value {
    width: 44px; text-align: center; background: transparent; border: none; border-left: 1px solid var(--line); border-right: 1px solid var(--line);
    color: var(--text); font-family: var(--font-mono); font-size: 15px; font-weight: 600; -moz-appearance: textfield;
  }
  .stepper-value::-webkit-outer-spin-button, .stepper-value::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .stepper-value:focus { outline: none; background: var(--accent-dim); }
  .stepper-max { display: flex; align-items: center; padding: 0 10px; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

  .toggle { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; flex-shrink: 0; }
  .toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .toggle-track { width: 40px; height: 22px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 11px; position: relative; transition: background .15s, border-color .15s; }
  .toggle-thumb { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
  .toggle input:checked + .toggle-track { background: var(--accent-dim); border-color: var(--accent); }
  .toggle input:checked + .toggle-track .toggle-thumb { transform: translateX(18px); background: var(--accent); }
  .toggle input:focus-visible + .toggle-track { outline: 2px solid var(--accent); outline-offset: 2px; }
  .toggle-text { font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; width: 28px; }
  .toggle input:checked ~ .toggle-text { color: var(--accent); }

  /* active talents & gear sets */
  .effects-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 780px) { .effects-grid { grid-template-columns: 1fr; } }
  .effect-row { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 16px; border-bottom: 1px solid var(--line); font-size: 13px; gap: 10px; }
  .effect-row:last-child { border-bottom: none; }
  .effect-row .e-name { font-weight: 600; }
  .effect-row .e-slot { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); text-transform: uppercase; white-space: nowrap; }
  .brandset-row { padding: 9px 16px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .brandset-row:last-child { border-bottom: none; }
  .brandset-row.active { background: var(--accent-dim); }
  .brandset-row .bs-top { display: flex; justify-content: space-between; }
  .brandset-row .bs-name { font-weight: 600; }
  .brandset-row .bs-count { font-family: var(--font-mono); color: var(--muted); }
  .brandset-row.active .bs-count { color: var(--accent); }
  .brandset-row .bs-bonus { color: var(--muted); margin-top: 2px; }
  .brandset-row.active .bs-bonus { color: var(--text); }
  .empty-inline { padding: 16px; color: var(--muted); font-size: 13px; text-align: center; }

  /* in-depth details */
  .depth-tables { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 2px; background: var(--line); border: 1px solid var(--line); }
  .depth-col { background: var(--panel); }
  .depth-talent-row { padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .depth-talent-row:last-child { border-bottom: none; }
  .depth-talent-row .dt-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .depth-talent-row .dt-name { font-weight: 600; color: var(--accent); }
  .depth-talent-row .dt-source { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); text-transform: uppercase; white-space: nowrap; }
  .depth-talent-row .dt-desc { color: var(--muted); font-size: 13px; margin-top: 4px; line-height: 1.5; white-space: pre-line; }
  .depth-talent-row.depth-set-box.is-gearset { background: var(--panel-2); border-left: 3px solid var(--q-gearset); }
  .depth-talent-row.depth-set-box.is-gearset .dt-name { color: var(--q-gearset); }
  .depth-talent-row.depth-set-box.is-brand { background: var(--panel-2); border-left: 3px solid var(--q-highend); }
  .depth-talent-row.depth-set-box.is-brand .dt-name { color: var(--q-highend); }
  .dt-boost { font-family: var(--font-mono); font-size: 10px; color: var(--accent); margin-top: 3px; }
  .dt-subtalents { margin-top: 10px; padding-top: 6px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .dt-sub { padding-left: 10px; border-left: 2px solid var(--line); }
  .dt-sub-name { font-weight: 600; font-size: 13px; }

  .grid-block { background: var(--panel); border: 1px solid var(--line); margin-bottom: 14px; }
  .grid-block-head {
    font-family: var(--font-display); font-size: 15px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    padding: 10px 16px; border-bottom: 1px solid var(--line); color: var(--text);
  }
  .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 2px; padding: 2px; }
  .weapon-grid { grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 760px) { .weapon-grid { grid-template-columns: 1fr; } }
  .gear-grid { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 560px) { .gear-grid { grid-template-columns: 1fr; } }
  .item-tile {
    background: var(--panel-2); border-left: 4px solid var(--line); padding: 10px 12px; min-height: 56px;
    display: flex; flex-direction: column; justify-content: flex-start; gap: 8px; position: relative;
  }
  .item-tile[data-weapon-slot], .item-tile[data-gear-slot] { cursor: pointer; }
  .item-tile[data-weapon-slot]:hover .tile-name-inline, .item-tile[data-gear-slot]:hover .tile-name-inline,
  .item-tile[data-weapon-slot]:hover .tile-name, .item-tile[data-gear-slot]:hover .tile-name { text-decoration: underline; }
  .item-tile:hover { background: var(--accent-dim); }
  .item-tile.core-O { border-left-color: var(--red); }
  .item-tile.core-D { border-left-color: var(--blue); }
  .item-tile.core-U { border-left-color: var(--yellow); }
  .item-tile .tile-top { display: flex; align-items: center; gap: 6px; padding-right: 22px; }
  .item-tile .tile-label { font-family: var(--font-mono); font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; flex-shrink: 0; }
  .item-tile .tile-icon { width: 15px; height: 15px; opacity: .85; flex-shrink: 0; }
  .item-tile .tile-subtype {
    font-family: var(--font-mono); font-size: 10px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0; max-width: 90px;
  }
  .item-tile .tile-subtype::before { content: "· "; }
  .item-tile .tile-top .qtag { flex-shrink: 0; }
  .item-tile .tile-name-inline {
    font-family: var(--font-body); font-weight: 600; font-size: 14px; line-height: 1.25;
    flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .item-tile .tile-name-inline.placeholder { color: var(--muted); font-weight: 400; font-style: italic; }
  .item-tile .tile-name { font-family: var(--font-body); font-weight: 600; font-size: 14px; margin-top: 2px; line-height: 1.25; }
  .item-tile .tile-name.placeholder { color: var(--muted); font-weight: 400; font-style: italic; }
  .item-tile .tile-meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .gear-exp-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-family: var(--font-mono); font-size: 11px; }
  .gear-exp-armor { color: var(--blue); font-weight: 600; }
  .gear-exp-field { color: var(--muted); display: flex; align-items: center; gap: 4px; letter-spacing: .04em; }
  .gear-exp-input {
    width: 38px; background: var(--panel); border: 1px solid var(--line); color: var(--text);
    font-family: var(--font-mono); font-size: 11px; padding: 2px 4px; text-align: right;
  }
  .item-tile.q-Exotic { box-shadow: inset 0 2px 0 var(--q-exotic); }
  .item-tile.q-Named { box-shadow: inset 0 2px 0 var(--q-named); }
  .item-tile.q-Gearset { box-shadow: inset 0 2px 0 var(--q-gearset); }
  .item-tile.q-HighEnd { box-shadow: inset 0 2px 0 var(--q-highend); }
  .q-Exotic .tile-name, .q-Exotic .tile-name-inline { color: var(--q-exotic); }
  .q-Named .tile-name, .q-Named .tile-name-inline { color: var(--q-named-text); }
  .pitem.q-Named .piname { color: var(--q-named-text); }
  .q-Gearset .tile-name, .q-Gearset .tile-name-inline { color: var(--q-gearset); }
  .q-HighEnd .tile-name, .q-HighEnd .tile-name-inline { color: var(--q-highend); }
  .qtag { font-family: var(--font-mono); font-size: 9.5px; padding: 1px 6px; border-radius: 2px; text-transform: uppercase; letter-spacing: .04em; }
  .qtag.q-Exotic { background: var(--q-exotic); color: #1a0a06; }
  .qtag.q-Named { background: var(--q-named); color: #1a1206; }
  .qtag.q-HighEnd { background: var(--q-highend); color: #1a1206; }
  .qtag.q-Gearset { background: var(--q-gearset); color: #05201d; }
  .tile-talent { font-size: 11.5px; line-height: 1.4; }
  .tile-talent .tt-name { font-weight: 600; color: var(--accent); }
  .tile-talent .tt-desc { color: var(--muted); margin-top: 2px; white-space: pre-line; }
  .tile-pick-talent {
    align-self: flex-start; font-family: var(--font-mono); font-size: 10.5px; padding: 4px 9px;
    background: none; border: 1px dashed var(--line); color: var(--muted); cursor: pointer;
  }
  .tile-pick-talent:hover { border-color: var(--accent); color: var(--accent); }
  .tile-unequip {
    position: absolute; top: 8px; right: 8px; z-index: 1; background: var(--panel); border: 1px solid var(--line);
    color: var(--muted); font-family: var(--font-mono); font-size: 10px; line-height: 1; padding: 4px 6px; cursor: pointer;
  }
  .tile-unequip:hover { border-color: var(--red); color: var(--red); }

  /* inline roll editors (core / attribute / mod value + identity overrides) */
  .roll-rows { padding: 8px 12px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 5px; }
  .roll-rows[hidden] { display: none; }
  .roll-row { display: flex; align-items: center; gap: 6px; font-size: 11.5px; }
  .roll-row .roll-select, .roll-row .attach-select { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); color: var(--text); font-family: var(--font-mono); font-size: 11px; padding: 3px 4px; }
  .attach-block { border-top: 1px solid var(--line); }
  .attach-toggle {
    width: 100%; text-align: left; background: none; border: none; padding: 6px 12px; cursor: pointer;
    font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em;
    display: flex; justify-content: space-between; align-items: center;
  }
  .attach-toggle:hover { color: var(--accent); }
  .attach-rows { border-top: 1px solid var(--line); }
  .roll-row .attach-slot-label { font-family: var(--font-mono); font-size: 10px; color: var(--muted); width: 64px; flex-shrink: 0; }
  .roll-row .attach-bonus {
    font-family: var(--font-mono); font-size: 10.5px; color: var(--text); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; flex-shrink: 0; max-width: 130px;
  }
  .roll-row .roll-label-fixed { flex: 1; min-width: 0; color: var(--muted); font-family: var(--font-mono); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .roll-row .roll-input { width: 64px; flex-shrink: 0; background: var(--panel); border: 1px solid var(--line); color: var(--text); font-family: var(--font-mono); font-size: 11px; padding: 3px 4px; text-align: right; }
  .roll-row .roll-icon { width: 15px; height: 15px; flex-shrink: 0; opacity: .9; }
  .roll-row .roll-icon-lg { width: 20px; height: 20px; }

  /* inline keyword coloring inside talent/bonus text and quality summaries */
  .kw-exotic { color: var(--kw-exotic); font-weight: 600; }
  .kw-named { color: var(--kw-named); font-weight: 600; }
  .kw-highend { color: var(--kw-highend); font-weight: 600; }
  .kw-amplify { color: var(--kw-amplify); font-weight: 700; }
  .kw-overcharge { color: var(--kw-overcharge); font-weight: 700; }
  .kw-damage { color: var(--red); font-weight: 600; }
  .kw-utility { color: var(--yellow); font-weight: 600; }
  .kw-defense { color: var(--blue); font-weight: 600; }
  .kw-condition { color: var(--purple); font-weight: 600; }
  .kw-common-condition { color: var(--cyan); font-weight: 600; }
  .kw-skill { color: var(--green); font-weight: 600; }
  .kw-explosive { color: var(--amber); font-weight: 600; }
  .kw-stack { color: var(--indigo); font-weight: 600; }
  .kw-distance { color: var(--accent); font-weight: 600; }

  /* ---------- SHD WATCH ---------- */
  .shd-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
  .shd-total { font-family: var(--font-display); font-size: 16px; text-transform: uppercase; letter-spacing: .03em; }
  .shd-actions { display: flex; gap: 8px; }

  .lib-browse-head h3 { font-family: var(--font-display); font-size: 20px; margin: 0; text-transform: uppercase; letter-spacing: .03em; }


  /* ---------- shared: picker dialog ---------- */
  dialog.picker { border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 0; width: min(760px, 94vw); max-height: 80vh; }
  dialog.picker::backdrop { background: rgba(0,0,0,.65); }

  .picker-head h3 { margin: 0; font-family: var(--font-display); font-size: 20px; text-transform: uppercase; letter-spacing: .03em; }
  .picker-head button { background: none; border: 1px solid var(--line); color: var(--text); cursor: pointer; padding: 6px 10px; font-family: var(--font-mono); }
  .picker-search { padding: 10px 18px; border-bottom: 1px solid var(--line); }

  .picker-cats { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 18px; border-bottom: 1px solid var(--line); }
  .picker-cat { font-family: var(--font-mono); font-size: 11px; padding: 5px 11px; border: 1px solid var(--line); color: var(--muted); cursor: pointer; background: var(--panel-2); }
  .picker-cat:hover { color: var(--text); }
  .picker-cat.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .picker-list { overflow-y: auto; max-height: 52vh; }
  .pitem {
    padding: 11px 18px; border-bottom: 1px solid var(--line); border-left: 4px solid var(--line); cursor: pointer; display: grid;
    grid-template-columns: 1fr auto; gap: 4px 14px; align-items: start;
  }

  .pitem .piname { font-weight: 600; font-size: 14.5px; }
  .pitem .piquality { font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; }
