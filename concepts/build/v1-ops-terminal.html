<meta charset="utf-8">
<title>SHD Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a09; --panel: #14140f; --panel-2: #1c1c15; --line: #33321f;
    --text: #ece9df; --muted: #948f78; --accent: #f2711c; --accent-dim: #4a2a0d;
    --red: #cf3f2e; --blue: #3a86c8; --yellow: #e0b62f; --purple: #c084fc; --cyan: #22d3ee; --green: #4ade80; --amber: #f59e0b; --indigo: #818cf8;
    --q-exotic: #d9432e; --q-named: #e3a73b; --q-gearset: #2fa89c; --q-highend: #e3a73b; --q-named-text: #e85dae;
    --kw-exotic: #f2711c; --kw-named: #e85dae; --kw-highend: #e0b62f; --kw-amplify: #9dff1f; --kw-overcharge: #ff2ec4;
    --font-display: "Oswald", "Arial Narrow", sans-serif;
    --font-body: "Barlow", "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", "Consolas", monospace;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]):not([data-theme="light"]) {
      --bg: #eeece3; --panel: #ffffff; --panel-2: #f5f3e9; --line: #d8d4bf;
      --text: #201e15; --muted: #6b6752; --accent: #c05a12; --accent-dim: #f4ddc6;
      --kw-amplify: #5a8f00; --purple: #8b5cf6; --cyan: #0e7490; --green: #15803d; --amber: #b45309; --indigo: #4338ca; --kw-overcharge: #a3157f;
    }
  }
  :root[data-theme="light"] {
    --bg: #eeece3; --panel: #ffffff; --panel-2: #f5f3e9; --line: #d8d4bf;
    --text: #201e15; --muted: #6b6752; --accent: #c05a12; --accent-dim: #f4ddc6;
    --kw-amplify: #5a8f00; --kw-overcharge: #a3157f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); }
  ::selection { background: var(--accent); color: #0a0a09; }
  *:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app { max-width: 1320px; margin: 0 auto; padding-bottom: 40px; }

  nav.topbar {
    display: flex; align-items: center; justify-content: space-between; padding: 14px 24px;
    border-bottom: 2px solid var(--accent); background: var(--panel);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img { width: 26px; height: 26px; opacity: .9; }
  .brand .name { font-family: var(--font-display); font-weight: 600; font-size: 19px; letter-spacing: .04em; text-transform: uppercase; }
  .tabs { display: flex; gap: 4px; }
  .tab {
    font-family: var(--font-display); font-weight: 500; font-size: 14px; letter-spacing: .06em; text-transform: uppercase;
    padding: 9px 20px; background: transparent; border: none; color: var(--muted); cursor: pointer;
  }
  .tab.active { background: var(--accent); color: #140b03; }
  .tab:hover:not(.active) { color: var(--text); }
  .topbar-actions { display: flex; gap: 8px; }
  .btn-ghost {
    font-family: var(--font-mono); font-size: 11.5px; padding: 7px 12px; background: transparent;
    border: 1px solid var(--line); color: var(--muted); cursor: pointer;
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

  .screen { padding: 22px 24px; }
  .screen[hidden] { display: none; }

  /* ---------- INVENTORY ---------- */
  .inv-stack { display: flex; flex-direction: column; gap: 14px; }

  /* compact expandable stat summary — one toggle expands all three together */
  .stat-summary-wrap { background: var(--panel); border: 1px solid var(--line); }
  .stat-chips { display: grid; grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 700px) { .stat-chips { grid-template-columns: 1fr; } }
  .stat-chip { padding: 12px 16px; cursor: pointer; border-left: 1px solid var(--line); }
  .stat-chip:first-child { border-left: none; }
  .stat-chip:hover { background: var(--panel-2); }
  .stat-chip .sc-top { display: flex; justify-content: space-between; align-items: baseline; }
  .stat-chip .sc-label { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .stat-chip .sc-caret { color: var(--muted); font-family: var(--font-mono); font-size: 11px; transition: transform .15s; }
  .stat-summary-wrap.open .sc-caret { transform: rotate(180deg); color: var(--accent); }
  .stat-chip .sc-value { font-family: var(--font-display); font-size: 26px; font-weight: 600; margin-top: 2px; }
  .stat-chip .sc-sub { font-family: var(--font-mono); font-size: 11px; color: var(--accent); margin-left: 6px; }
  .stat-chip .sc-cap-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-left: 7px; vertical-align: middle; }
  .stat-detail-row .cap-badge {
    font-family: var(--font-mono); font-size: 9px; padding: 1px 5px; margin-left: 6px; background: var(--accent-dim);
    color: var(--accent); border-radius: 2px; text-transform: uppercase; letter-spacing: .04em;
  }
  .stat-details { grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); background: var(--panel-2); display: none; }
  .stat-summary-wrap.open .stat-details { display: grid; }
  .stat-detail-col { border-left: 1px solid var(--line); padding: 4px 0; }
  .stat-detail-col:first-child { border-left: none; }
  @media (max-width: 700px) { .stat-details { grid-template-columns: 1fr; } .stat-detail-col { border-left: none; border-top: 1px solid var(--line); } .stat-detail-col:first-child { border-top: none; } }
  .stat-detail-row { display: flex; justify-content: space-between; padding: 7px 16px; font-size: 12.5px; border-bottom: 1px solid var(--line); gap: 10px; }
  .stat-detail-row:last-child { border-bottom: none; }
  .stat-detail-row .label { color: var(--muted); }
  .stat-detail-row .value { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }

  /* slim exotic/named/gearset summary */
  .quality-strip {
    display: flex; flex-wrap: wrap; gap: 4px 18px; padding: 6px 4px; font-family: var(--font-mono); font-size: 11px;
  }
  .quality-strip .qs-empty { color: var(--muted); font-style: italic; }
  .quality-strip .qs-group { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
  .quality-strip .qs-label { color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-size: 10px; }
  .quality-strip .qs-exotic .qs-label, .quality-strip .qs-exotic .qs-item { color: var(--q-exotic); }
  .quality-strip .qs-named .qs-label, .quality-strip .qs-named .qs-item { color: var(--q-named-text); }
  .quality-strip .qs-gearset .qs-label, .quality-strip .qs-gearset .qs-item { color: var(--q-gearset); }
  .quality-strip .qs-item:not(:last-child)::after { content: ", "; color: var(--muted); }
  .quality-strip .qs-attr .qs-label { color: var(--muted); }
  .quality-strip .qs-attr .qs-item { color: var(--text); }

  /* ---------- damage projection panel: crit/headshot/conditional-bonus toggles ---------- */
  .damage-panel {
    background: var(--panel); border: 1px solid var(--line); padding: 14px 16px; width: 260px;
  }
  .damage-panel:empty { display: none; }
  @media (min-width: 1560px) {
    .damage-panel { position: fixed; top: 90px; right: max(16px, calc((100vw - 1320px) / 2 - 276px)); max-height: 78vh; overflow-y: auto; z-index: 5; }
  }
  .damage-panel .dp-title { font-family: var(--font-display); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 10px; }
  .damage-panel .dp-weapon-tabs { display: flex; gap: 4px; margin-bottom: 10px; }
  .damage-panel .dp-weapon-tab { flex: 1; font-family: var(--font-mono); font-size: 10.5px; padding: 5px 4px; border: 1px solid var(--line); color: var(--muted); cursor: pointer; background: var(--panel-2); }
  .damage-panel .dp-weapon-tab:not(:disabled):hover { color: var(--text); }
  .damage-panel .dp-weapon-tab.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .damage-panel .dp-weapon-tab:disabled { opacity: .35; cursor: default; }
  .damage-panel .dp-base { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 10px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
  .damage-panel .dp-base-label { font-size: 12.5px; color: var(--muted); }
  .damage-panel .dp-base-value { font-family: var(--font-mono); font-size: 15px; font-weight: 600; }
  .damage-panel .dp-group-label { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 10px 0 4px; }
  .damage-panel .dp-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; }
  .damage-panel .dp-toggle { margin-left: auto; }
  .damage-panel .dp-row-label { font-size: 12.5px; line-height: 1.35; }
  .damage-panel .dp-row-amount { color: var(--red); font-family: var(--font-mono); }
  .damage-panel .dp-pellet-input {
    width: 52px; background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    font-family: var(--font-mono); font-size: 12px; padding: 3px 6px; text-align: right;
  }
  .damage-panel .dp-choice-row { padding-bottom: 2px; }
  .damage-panel .dp-choice-btns { display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px; }
  .damage-panel .dp-choice-btn {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--muted);
    font-family: var(--font-body); font-size: 12px; padding: 5px 9px; cursor: pointer; text-align: left;
  }
  .damage-panel .dp-choice-btn:hover { color: var(--text); }
  .damage-panel .dp-choice-btn.active { border-color: var(--accent); color: var(--text); background: var(--accent-dim); }
  .damage-panel .dp-choice-btn .dp-row-amount { font-size: 11px; }
  .damage-panel .dp-result { display: flex; justify-content: space-between; align-items: baseline; padding-top: 10px; margin-top: 10px; border-top: 1px solid var(--line); }
  .damage-panel .dp-result-label { font-size: 12.5px; color: var(--muted); }
  .damage-panel .dp-result-value { font-family: var(--font-mono); font-size: 17px; font-weight: 700; color: var(--accent); }
  .damage-panel .dp-empty { font-size: 12px; color: var(--muted); padding: 4px 0; }

  /* ---------- loadout-wide settings: expertise stepper + SHD watch toggle ---------- */
  .loadout-settings { display: flex; flex-wrap: wrap; gap: 2px; background: var(--line); border: 1px solid var(--line); }
  .setting-card { flex: 1 1 240px; background: var(--panel); padding: 11px 16px; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .setting-head { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .setting-name { font-family: var(--font-display); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--text); }
  .setting-note { font-family: var(--font-body); font-size: 11px; color: var(--muted); }

  .stepper { display: flex; align-items: stretch; border: 1px solid var(--line); background: var(--panel-2); flex-shrink: 0; }
  .stepper-btn {
    width: 28px; background: none; border: none; color: var(--muted); font-family: var(--font-mono); font-size: 16px;
    cursor: pointer; line-height: 1; padding: 0;
  }
  .stepper-btn:hover { background: var(--accent-dim); color: var(--accent); }
  .stepper-btn:active { background: var(--accent); color: #140b03; }
  .stepper-value {
    width: 44px; text-align: center; background: transparent; border: none; border-left: 1px solid var(--line); border-right: 1px solid var(--line);
    color: var(--text); font-family: var(--font-mono); font-size: 15px; font-weight: 600; -moz-appearance: textfield;
  }
  .stepper-value::-webkit-outer-spin-button, .stepper-value::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .stepper-value:focus { outline: none; background: var(--accent-dim); }
  .stepper-max { display: flex; align-items: center; padding: 0 10px; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

  .toggle { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; flex-shrink: 0; }
  .toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .toggle-track { width: 40px; height: 22px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 11px; position: relative; transition: background .15s, border-color .15s; }
  .toggle-thumb { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
  .toggle input:checked + .toggle-track { background: var(--accent-dim); border-color: var(--accent); }
  .toggle input:checked + .toggle-track .toggle-thumb { transform: translateX(18px); background: var(--accent); }
  .toggle input:focus-visible + .toggle-track { outline: 2px solid var(--accent); outline-offset: 2px; }
  .toggle-text { font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; width: 28px; }
  .toggle input:checked ~ .toggle-text { color: var(--accent); }

  /* active talents & gear sets */
  .effects-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 780px) { .effects-grid { grid-template-columns: 1fr; } }
  .effect-row { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 16px; border-bottom: 1px solid var(--line); font-size: 13px; gap: 10px; }
  .effect-row:last-child { border-bottom: none; }
  .effect-row .e-name { font-weight: 600; }
  .effect-row .e-slot { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); text-transform: uppercase; white-space: nowrap; }
  .brandset-row { padding: 9px 16px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .brandset-row:last-child { border-bottom: none; }
  .brandset-row.active { background: var(--accent-dim); }
  .brandset-row .bs-top { display: flex; justify-content: space-between; }
  .brandset-row .bs-name { font-weight: 600; }
  .brandset-row .bs-count { font-family: var(--font-mono); color: var(--muted); }
  .brandset-row.active .bs-count { color: var(--accent); }
  .brandset-row .bs-bonus { color: var(--muted); margin-top: 2px; }
  .brandset-row.active .bs-bonus { color: var(--text); }
  .empty-inline { padding: 16px; color: var(--muted); font-size: 13px; text-align: center; }

  /* in-depth details */
  .depth-tables { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 2px; background: var(--line); border: 1px solid var(--line); }
  .depth-col { background: var(--panel); }
  .depth-talent-row { padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .depth-talent-row:last-child { border-bottom: none; }
  .depth-talent-row .dt-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .depth-talent-row .dt-name { font-weight: 600; color: var(--accent); }
  .depth-talent-row .dt-source { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); text-transform: uppercase; white-space: nowrap; }
  .depth-talent-row .dt-desc { color: var(--muted); font-size: 13px; margin-top: 4px; line-height: 1.5; white-space: pre-line; }
  .depth-talent-row.depth-set-box.is-gearset { background: var(--panel-2); border-left: 3px solid var(--q-gearset); }
  .depth-talent-row.depth-set-box.is-gearset .dt-name { color: var(--q-gearset); }
  .depth-talent-row.depth-set-box.is-brand { background: var(--panel-2); border-left: 3px solid var(--q-highend); }
  .depth-talent-row.depth-set-box.is-brand .dt-name { color: var(--q-highend); }
  .dt-boost { font-family: var(--font-mono); font-size: 10px; color: var(--accent); margin-top: 3px; }
  .dt-subtalents { margin-top: 10px; padding-top: 6px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .dt-sub { padding-left: 10px; border-left: 2px solid var(--line); }
  .dt-sub-name { font-weight: 600; font-size: 13px; }

  .grid-block { background: var(--panel); border: 1px solid var(--line); margin-bottom: 14px; }
  .grid-block-head {
    font-family: var(--font-display); font-size: 15px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    padding: 10px 16px; border-bottom: 1px solid var(--line); color: var(--text);
  }
  .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 2px; padding: 2px; }
  .weapon-grid { grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 760px) { .weapon-grid { grid-template-columns: 1fr; } }
  .gear-grid { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 560px) { .gear-grid { grid-template-columns: 1fr; } }
  .item-tile {
    background: var(--panel-2); border-left: 4px solid var(--line); padding: 10px 12px; min-height: 56px;
    display: flex; flex-direction: column; justify-content: flex-start; gap: 8px; position: relative;
  }
  .item-tile[data-weapon-slot], .item-tile[data-gear-slot] { cursor: pointer; }
  .item-tile[data-weapon-slot]:hover .tile-name-inline, .item-tile[data-gear-slot]:hover .tile-name-inline,
  .item-tile[data-weapon-slot]:hover .tile-name, .item-tile[data-gear-slot]:hover .tile-name { text-decoration: underline; }
  .item-tile:hover { background: var(--accent-dim); }
  .item-tile.core-O { border-left-color: var(--red); }
  .item-tile.core-D { border-left-color: var(--blue); }
  .item-tile.core-U { border-left-color: var(--yellow); }
  .item-tile .tile-top { display: flex; align-items: center; gap: 6px; padding-right: 22px; }
  .item-tile .tile-label { font-family: var(--font-mono); font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; flex-shrink: 0; }
  .item-tile .tile-icon { width: 15px; height: 15px; opacity: .85; flex-shrink: 0; }
  .item-tile .tile-subtype {
    font-family: var(--font-mono); font-size: 10px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0; max-width: 175px;
  }
  .item-tile .tile-subtype::before { content: "· "; }
  .item-tile .tile-top .qtag { flex-shrink: 0; }
  .item-tile .tile-name-inline {
    font-family: var(--font-body); font-weight: 600; font-size: 14px; line-height: 1.25;
    flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .item-tile .tile-name-inline.placeholder { color: var(--muted); font-weight: 400; font-style: italic; }
  .item-tile .tile-name { font-family: var(--font-body); font-weight: 600; font-size: 14px; margin-top: 2px; line-height: 1.25; }
  .item-tile .tile-name.placeholder { color: var(--muted); font-weight: 400; font-style: italic; }
  .item-tile .tile-meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .gear-exp-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-family: var(--font-mono); font-size: 11px; }
  .gear-exp-armor { color: var(--blue); font-weight: 600; }
  .gear-exp-field { color: var(--muted); display: flex; align-items: center; gap: 4px; letter-spacing: .04em; }
  .gear-exp-input {
    width: 38px; background: var(--panel); border: 1px solid var(--line); color: var(--text);
    font-family: var(--font-mono); font-size: 11px; padding: 2px 4px; text-align: right;
  }
  .item-tile.q-Exotic { box-shadow: inset 0 2px 0 var(--q-exotic); }
  .item-tile.q-Named { box-shadow: inset 0 2px 0 var(--q-named); }
  .item-tile.q-Gearset { box-shadow: inset 0 2px 0 var(--q-gearset); }
  .item-tile.q-HighEnd { box-shadow: inset 0 2px 0 var(--q-highend); }
  .q-Exotic .tile-name, .q-Exotic .tile-name-inline { color: var(--q-exotic); }
  .q-Named .tile-name, .q-Named .tile-name-inline { color: var(--q-named-text); }
  .pitem.q-Named .piname { color: var(--q-named-text); }
  .q-Gearset .tile-name, .q-Gearset .tile-name-inline { color: var(--q-gearset); }
  .q-HighEnd .tile-name, .q-HighEnd .tile-name-inline { color: var(--q-highend); }
  .qtag { font-family: var(--font-mono); font-size: 9.5px; padding: 1px 6px; border-radius: 2px; text-transform: uppercase; letter-spacing: .04em; }
  .qtag.q-Exotic { background: var(--q-exotic); color: #1a0a06; }
  .qtag.q-Named { background: var(--q-named); color: #1a1206; }
  .qtag.q-HighEnd { background: var(--q-highend); color: #1a1206; }
  .qtag.q-Gearset { background: var(--q-gearset); color: #05201d; }
  .tile-talent { font-size: 11.5px; line-height: 1.4; }
  .tile-talent .tt-name { font-weight: 600; color: var(--accent); }
  .tile-talent .tt-desc { color: var(--muted); margin-top: 2px; white-space: pre-line; }
  .tile-pick-talent {
    align-self: flex-start; font-family: var(--font-mono); font-size: 10.5px; padding: 4px 9px;
    background: none; border: 1px dashed var(--line); color: var(--muted); cursor: pointer;
  }
  .tile-pick-talent:hover { border-color: var(--accent); color: var(--accent); }

<script>
(function () {
  const DATA = JSON.parse(document.getElementById("app-data").textContent);
  const Engine = window.Engine.init(DATA);

  // Slot "P" = primary-capable weapons, "S" = sidearms (pistols) - Primary/Secondary and
  // Sidearm are mutually exclusive pools, never cross-equippable.
  const WEAPON_SLOTS = [
    { key: "Primary", label: "Primary", slot: "P", icon: "main-weapon.png" },
    { key: "Secondary", label: "Secondary", slot: "P", icon: "main-weapon.png" },
    { key: "SideArm", label: "Sidearm", slot: "S", icon: "sidearm.png" },
  ];
  const GEAR_SLOTS = [
    { key: "Mask", icon: "mask.png" }, { key: "Backpack", icon: "backpack.png" },
    { key: "Chest", icon: "chest.png" }, { key: "Gloves", icon: "gloves.png" },
    { key: "Holster", icon: "holster.png" }, { key: "Kneepads", icon: "kneepads.png" },
  ];
  const WEAPON_TYPES = ["Assault Rifle", "LMG", "Marksman Rifle", "Pistol", "Rifle", "Shotgun", "SMG"];

  // Per-slot armor catalogs (Library, and the equip picker) show only Named, Exotic, and
  // Crafted/Improvised pieces — every other High-End / Gearset piece is browsed by brand instead.
  function isArmorCatalogItem(g) { return g.Quality === "Exotic" || g.Quality === "Named" || g.Brand === "Crafted"; }
  function uniqueBrands(matchFn) {
    const set = new Set();
    GEAR_SLOTS.forEach((s) => DATA.gear[s.key].forEach((g) => { if (matchFn(g)) set.add(g.Brand); }));
    return Array.from(set).sort();
  }
  const REGULAR_BRANDS = uniqueBrands((g) => (g.Quality === "High End" || g.Quality === "Named") && g.Brand !== "Crafted");
  const GEARSET_BRANDS = uniqueBrands((g) => g.Quality === "Gearset");
  const TALENT_CATS = [
    ...WEAPON_TYPES.map((t) => ({ kind: "weapon", key: t, label: t })),
    ...GEAR_SLOTS.map((s) => ({ kind: "gear", key: s.key, label: s.key })),
  ];
  function talentsForCat(cat) {
    return cat.kind === "weapon" ? DATA.weaponTalents.filter((t) => t[cat.key] === "x") : DATA.gearTalents.filter((t) => t.Slot === cat.key);
  }
  function brandIcon(brand) {
    for (const s of GEAR_SLOTS) {
      const found = DATA.gear[s.key].find((g) => g.Brand === brand && g.Quality === "High End" && g.Icon) || DATA.gear[s.key].find((g) => g.Brand === brand && g.Icon);
      if (found) return found.Icon;
    }
    return null;
  }

  function loadSHD() {
    const levels = Engine.defaultSHDLevels();
    try {
      const saved = JSON.parse(localStorage.getItem("shd-watch-levels") || "null");
      if (Array.isArray(saved)) levels.forEach((l, i) => { if (typeof saved[i] === "number") l.value = Math.max(0, Math.min(l.max, saved[i])); });
    } catch (e) { /* ignore corrupt storage */ }
    return levels;
  }
  function saveSHD() {
    try { localStorage.setItem("shd-watch-levels", JSON.stringify(state.shd.map((l) => l.value))); } catch (e) { /* storage may be unavailable */ }
  }

  // one shared expertise level (0-30) stands in for every weapon's individual expertise, and
  // is the default for every gear piece's own expertise (gear pieces can override it below).
  function loadExpertise() {
    try {
      const raw = localStorage.getItem("expertise-level");
      if (raw !== null) {
        const saved = Number(raw);
        if (Number.isFinite(saved)) return Math.max(0, Math.min(30, saved));
      }
    } catch (e) { /* ignore corrupt storage */ }
    return 30;
  }
  function saveExpertise() {
    try { localStorage.setItem("expertise-level", String(state.expertise)); } catch (e) { /* storage may be unavailable */ }
  }
  // per-piece expertise overrides (slot -> level), for gear and weapons alike. A slot with
  // no entry here just uses the shared expertise level above. Stepping the shared level
  // (up/down arrows or typing into that box) wipes every override - see setExpertise().
  function loadExpertiseOverrides(storageKey) {
    try {
      const raw = localStorage.getItem(storageKey);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === "object") return parsed;
      }
    } catch (e) { /* ignore corrupt storage */ }
    return {};
  }
  function saveExpertiseOverrides(storageKey, obj) {
    try { localStorage.setItem(storageKey, JSON.stringify(obj)); } catch (e) { /* storage may be unavailable */ }
  }
  function loadGearExpertise() { return loadExpertiseOverrides("gear-expertise-overrides"); }
  function saveGearExpertise() { saveExpertiseOverrides("gear-expertise-overrides", state.gearExpertise); }
  function loadWeaponExpertise() { return loadExpertiseOverrides("weapon-expertise-overrides"); }
  function saveWeaponExpertise() { saveExpertiseOverrides("weapon-expertise-overrides", state.weaponExpertise); }

  // named builds saved in this browser, keyed by name: { [name]: { savedAt, data } }, where
  // data is a serializeState()-shaped object (the same compact format the shareable URL uses).
  function loadSavedBuilds() {
    try {
      const raw = localStorage.getItem("saved-builds");
      if (raw) { const parsed = JSON.parse(raw); if (parsed && typeof parsed === "object") return parsed; }
    } catch (e) { /* ignore corrupt storage */ }
    return {};
  }
  function saveSavedBuilds(builds) {
    try { localStorage.setItem("saved-builds", JSON.stringify(builds)); } catch (e) { /* storage may be unavailable */ }
  }

  const state = { weapons: {}, gear: {}, skills: {}, spec: null, shd: loadSHD(), expertise: loadExpertise(), gearExpertise: loadGearExpertise(), weaponExpertise: loadWeaponExpertise() };
  // damage-projection panel toggle state (crit/headshot + one entry per active conditional
  // effect id below) - a what-if exploration layer, session-only, never persisted and never
  // fed back into the real computed stats.
  state.damageToggles = { crit: false, headshot: false, dta: false, dtooc: false, pellets: 0, tippingScalesStacks: 0, weaponSlot: "Primary" };
  let summaryOpen = false;
  let attachExpanded = {}; // weapon slot key -> bool, session-only UI state

  // a native <select>'s change event carries no modifier-key info, and by the time it fires
  // the OS-level dropdown has already taken and released focus - a page-level keydown/keyup
  // tracker doesn't reliably survive that round trip. Instead capture shiftKey at mousedown
  // on the select itself, before the dropdown opens, and read it back on change.
  function wireShiftCapture(sel) {
    sel.addEventListener("mousedown", (e) => { sel.dataset.shiftPick = e.shiftKey ? "1" : ""; });
  }
  function consumeShiftPick(sel) {
    const v = sel.dataset.shiftPick === "1";
    sel.dataset.shiftPick = "";
    return v;
  }

  function img(kind, file, cls) { const src = Engine.iconSrc(kind, file); return src ? '<img class="' + (cls || "") + '" src="' + src + '" alt="">' : ""; }
  function qClass(quality) { return quality ? quality.replace(/\s+/g, "") : ""; }
  function stripHtml(html) { return html.replace(/<[^>]*>/g, " "); }
  function fmt(n) { return Math.round(n).toLocaleString(); }
  function escapeAttr(s) { return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  // Critical Hit Chance caps at 60% in game - anything rolled above that is wasted. Color the
  // number red once you're over (not just at) the cap, and give it a tooltip breaking down
  // every source that adds up to the uncapped total, so it's obvious what to pull back on.
  const CHC_CAP = 60;
  function chcDisplayHtml(chc, sources) {
    const rounded = Math.round(chc);
    const over = rounded > CHC_CAP;
    const lines = (sources || []).map((s) => s.source + ": +" + Math.round(s.amount) + "%").join("\n");
    const tooltip = lines ? "Uncapped total: " + rounded + "%\n\n" + lines : "";
    return '<span' + (over ? ' style="color:var(--red)"' : "") + (tooltip ? ' title="' + escapeAttr(tooltip) + '"' : "") + '>' + rounded + '%</span>';
  }

  // Exotic > Named > Gear Set > everything else (High-End), then alphabetical within each tier
  // handles both full names (Exotic/Gearset/Named/High End) and the single-letter
  // codes used in the talent tables (E/S/N/A).
  const QUALITY_ORDER = { Exotic: 0, E: 0, Named: 1, N: 1, Gearset: 2, S: 2 };
  function qualityRank(q) { return QUALITY_ORDER[qClass(q)] !== undefined ? QUALITY_ORDER[qClass(q)] : 3; }
  function sortByQuality(list, getQuality, getName) {
    return list.slice().sort((a, b) => {
      const r = qualityRank(getQuality(a)) - qualityRank(getQuality(b));
      if (r !== 0) return r;
      return getName ? String(getName(a)).localeCompare(String(getName(b))) : 0;
    });
  }
  // colors the words that matter for scanning builds at a glance: quality tiers, the
  // "Amplify" keyword (multiplicative, not additive, damage), the stat category a bonus
  // belongs to (red=damage, yellow=utility/skill, blue=defense), status effects/conditions
  // a talent triggers on or inflicts, and distances (the game's own orange).
  //
  // To add a keyword: find the group below by color/meaning and add every inflected form
  // you expect in talent text - list each one explicitly, don't auto-generate suffixes
  // (irregular forms like "Bleeded" are wrong, so this stays a human judgment call). This
  // covers phrases with surrounding punctuation too ("(from all sources)" still matches on
  // just "from all sources" via \b, since \b only cares about the word's own edges, not
  // what's beyond them). Only a match on a dynamic value (a number) needs PHRASE_PATTERNS.
  const KEYWORD_GROUPS = [
    { cls: "kw-damage", words: ["Weapon Damage", "Assault Rifle Damage", "LMG Damage", "Marksman Rifle Damage", "Pistol Damage", "Rifle Damage", "Shotgun Damage", "SMG Damage",
      "Critical Hit Chance", "Critical Hit Damage", "Critical Hits", "Critical Hit", "Headshot Damage", "Headshots", "Headshot", "Damage to Armor", "Damage to TOC", "Damage to Health", "Health Damage", "Damage to Electronics", "Explosive Damage", "Melee"] },
    { cls: "kw-utility", words: ["Reload Speed", "Stability", "Accuracy", "Magazine Size", "Weapon Handling", "Rate of Fire",
      "Optimal Range", "Swap Speed", "Ammo Capacity", "Extra Rounds", "Skill Haste", "Skill Damage", "Skill Duration", "Repair Skills", "Skill Tier", "Skill Efficiency", "Skill Health", "Status Effects", "Status Effect"] },
    { cls: "kw-defense", words: ["Total Armor", "Bonus Armor", "Armor Regeneration", "Armor Regen", "Health", "Hazard Protection", "Explosive Resistance", "Damage Resistance",
      "Incoming Repairs", "Protection from Elites", "Armor on Kill", "Repairs", "Repaired", "Repair", "RPM"] },
    // status effects proper - the debuffs with a dedicated Resistance stat, plus every inflected
    // form (-ed/-ing/-s) actually likely to appear in talent prose, not just the base word
    { cls: "kw-condition", words: ["Bleed Resistance", "Burn Resistance", "Shock Resistance", "Disrupt Resistance", "Disorient Resistance", "Ensnare Resistance", "Pulse Resistance", "Blind/Deaf Resistance",
      "Bleed", "Bleeding", "Bleeds", "Bled",
      "Burn", "Burned", "Burning", "Burns",
      "Shock", "Shocked", "Shocking", "Shocks",
      "Disrupt", "Disrupted", "Disrupting", "Disrupts",
      "Disorient", "Disoriented", "Disorienting", "Disorients",
      "Ensnare", "Ensnared", "Ensnaring", "Ensnares",
      "Blind", "Blinded", "Blinding", "Blinds",
      "Deaf", "Deafened",
      "Confuse", "Confused", "Confusing", "Confuses",
      "EMP", "EMPed"] },
    // common battlefield states that aren't resistance-gated status effects (Suppressed isn't
    // resisted like Bleed/Burn are; Pulse here means "revealed by a Pulse", not Pulse Resistance)
    { cls: "kw-common-condition", words: ["Suppressed", "Suppression", "Suppressing", "Suppresses",
      "Pulsed", "Pulsing", "Pulses", "Pulse",
      "Poisoned", "Poisoning", "Poisons", "Poison",
      "Swapping", "Swap", "Switching", "Holstered", "Cover",
      "Marked", "Marking", "Marks", "Mark",
      "Reloading", "Reloaded", "Reload"] },
    // skill names - "Ballistic Shield" is often just called "Shield" in talent text
    { cls: "kw-skill", words: ["Sticky Bomb", "Ballistic Shield", "Shield", "Chem Launcher", "Seeker Mine", "Smart Cover", "Trap", "Decoy", "Turret", "Hive", "Firefly", "Drone"] },
    { cls: "kw-explosive", words: ["Grenade", "Grenades", "Explosion", "Explosions", "Explosive", "Explosives", "Explode", "Exploded", "Exploding", "Explodes"] },
    { cls: "kw-stack", words: ["Stacks", "Stacking", "Stacked", "Stack"] },
    // reuses kw-distance's orange - these aren't distances, the user just wants the same color
    { cls: "kw-distance", words: ["Skills", "Skill", "Allies", "Ally", "Weakpoints", "Weakpoint", "Signature Weapon"] },
    { cls: "kw-amplify", words: ["Amplifies", "Amplifying", "Amplify", "Amplified", "Amplification", "from all sources"] },
    { cls: "kw-overcharge", words: ["Overcharged", "Overcharging", "Overcharges", "Overcharge"] },
    { cls: "kw-exotic", words: ["Exotic"] },
    { cls: "kw-named", words: ["Named"] },
    { cls: "kw-highend", words: ["High End"] },
  ];
  // one combined map + single regex pass (longest phrase first) rather than one pass per
  // category - running separate passes let a short word like "Health" re-match text a longer
  // phrase ("Skill Health") had already wrapped in the previous pass, nesting spans.
  const KW_MAP = new Map();
  KEYWORD_GROUPS.forEach(({ cls, words }) => words.forEach((w) => KW_MAP.set(w.toLowerCase(), cls)));
  const KW_PATTERN = new RegExp(
    "\\b(" + [...KW_MAP.keys()].sort((a, b) => b.length - a.length).map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")\\b",
    "gi"
  );
  // entries that can't go through KW_PATTERN because the match is a dynamic value rather
  // than a fixed word (distances)
  const PHRASE_PATTERNS = [
    // "7m" / "7 meters" but not "9mm" (ammo caliber)
    { cls: "kw-distance", re: /\b\d+(?:\.\d+)?m\b(?!m)/g },
    { cls: "kw-distance", re: /\b\d+(?:\.\d+)?\s+meters?\b/gi },
  ];
  function highlightKeywords(text) {
    let out = text;
    PHRASE_PATTERNS.forEach(({ cls, re }) => { out = out.replace(re, (m) => '<span class="' + cls + '">' + m + '</span>'); });
    return out.replace(KW_PATTERN, (m) => '<span class="' + KW_MAP.get(m.toLowerCase()) + '">' + m + '</span>');
  }
  function compactDesc(text) { return text ? highlightKeywords(text.replace(/(\r?\n){2,}/g, "\n").trim()) : text; }
  function talentBlock(name, desc) {
    return '<div class="tile-talent"><div class="tt-name">' + name + '</div><div class="tt-desc">' + compactDesc(desc) + '</div></div>';
  }

  // ---- exotic exclusivity: only one exotic weapon, one exotic gear piece, at a time ----
  function hasExoticWeaponElsewhere(excludeSlot) {
    return Object.entries(state.weapons).some(([slot, w]) => slot !== excludeSlot && w && w.quality === "Exotic");
  }
  function hasExoticGearElsewhere(excludeSlot) {
    return Object.entries(state.gear).some(([slot, g]) => slot !== excludeSlot && g && g.quality === "Exotic");
  }

  function computeCurrent(shdOverride) {
    return Engine.computeLoadout({ weapons: state.weapons, gear: state.gear, specialization: state.spec ? { name: state.spec } : null, skills: state.skills, shd: shdOverride !== undefined ? shdOverride : state.shd, expertiseLevel: state.expertise, gearExpertise: state.gearExpertise, weaponExpertise: state.weaponExpertise });
  }

  // =================== INVENTORY: compact expandable stat summary ===================
  function renderStatSummary() {
    const result = computeCurrent();
    const p = result.weaponStats.Primary;
    // Critical Hit Chance can't exceed 60% in game - flag it the moment a build reaches or
    // passes that cap, both inline in the detail and as a small always-visible dot on the chip.
    const chcCapped = !!(p && p.chc >= CHC_CAP);
    const chips = [
      {
        key: "damage", label: "Weapon Damage", value: p ? fmt(p.totalDamage) : "—", sub: p ? "+" + Math.round(p.totalPct) + "%" : "",
        detail: p ? [
          ["Base Damage", fmt(p.baseDamage)],
          ["Expertise Bonus", "+" + p.expertiseLevel + "%"],
          ["Total Damage", fmt(p.totalDamage)],
          ["Headshot Damage", Math.round(p.hsd) + "%"],
          ["Critical Hit Damage", Math.round(p.chd) + "%"],
          ["Critical Hit Chance", chcDisplayHtml(p.chc, p.chcSources) + (chcCapped ? ' <span class="cap-badge" title="Critical Hit Chance caps at 60% in game">' + CHC_CAP + '% CAP</span>' : "")],
          ["RPM / Magazine", p.rpm + " / " + p.magSize],
        ] : [["No primary weapon equipped", "—"]],
      },
      {
        key: "armor", label: "Total Armor", value: fmt(result.totals.armor), sub: "",
        detail: [
          ["Base Armor (Gear, 0% Exp)", fmt(result.totals.baseArmorLvl40)],
          ["Expertise Bonus to Base", "+" + fmt(result.totals.expertiseBaseArmor - result.totals.baseArmorLvl40)],
          ["From Armor Cores", "+" + fmt(result.stats.Cores.Defensive.reduce((a, b) => a + b, 0))],
          ["Total Armor % Bonus", "+" + Math.round((result.stats.Defensive["Total Armor"] || 0) * 10) / 10 + "%"],
          ["Total Armor", fmt(result.totals.armor)],
          ["Health", fmt(result.totals.health)],
          ["Armor Cores Equipped", result.stats.Cores.Defensive.length],
          ["Effective Armor Regen", (() => {
            const flatRegen = result.stats.Defensive["Armor Regeneration"] || 0;
            const pctRegen = result.stats.Defensive["Armor Regeneration %"] || 0;
            if (!flatRegen && !pctRegen) return "—";
            const effective = flatRegen * (1 + pctRegen / 100);
            return fmt(effective) + (pctRegen ? " (" + fmt(flatRegen) + " base, +" + (Math.round(pctRegen * 10) / 10) + "%)" : "");
          })()],
        ],
      },
      {
        key: "skill", label: "Skill Power", value: result.totals.skillTier, sub: "Tier", detail:
          Object.keys(result.stats.Utility).length ? Object.entries(result.stats.Utility).map(([k, v]) => [k, (v > 0 && k !== "Skill Tier" ? "+" : "") + Math.round(v * 10) / 10 + (k === "Skill Tier" ? "" : "%")]) : [["No utility stats yet", "—"]],
      },
    ];
    document.getElementById("statSummaryWrap").className = "stat-summary-wrap" + (summaryOpen ? " open" : "");
    document.getElementById("statChips").innerHTML = chips.map((c) =>
      '<div class="stat-chip" data-chip="' + c.key + '">' +
      '<div class="sc-top"><span class="sc-label">' + c.label + (c.key === "damage" && chcCapped ? '<span class="sc-cap-dot" title="Critical Hit Chance capped at 60%"></span>' : "") + '</span><span class="sc-caret">▾</span></div>' +
      '<div class="sc-value">' + c.value + (c.sub ? '<span class="sc-sub">' + c.sub + '</span>' : "") + '</div></div>'
    ).join("");
    document.getElementById("statDetails").innerHTML = chips.map((c) =>
      '<div class="stat-detail-col">' + c.detail.map((d) => '<div class="stat-detail-row"><span class="label">' + d[0] + '</span><span class="value">' + d[1] + '</span></div>').join("") + '</div>'
    ).join("");
    document.querySelectorAll("[data-chip]").forEach((el) => el.addEventListener("click", () => {
      summaryOpen = !summaryOpen;
      renderStatSummary();
    }));
  }
